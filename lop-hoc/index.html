<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lớp học trực tiếp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
<!-- Kính dùng chung (react-liquis-glass + bật/tắt). Thiếu các tệp này trang vẫn chạy, chỉ không có nút bật/tắt -->
<link rel="stylesheet" href="/glass/react-liquis-glass.css">
<link rel="stylesheet" href="/glass/glass.css">
<script src="/glass/glass.js"></script>
<style>
/* Cùng bảng màu và font với Hán Lộ (packages/ui/src/tokens.css), giao diện tối định nghĩa lại cùng tên token */
:root {
  --bg: #F4F6F3; --surface: #FFFFFF; --surface-2: #EEF1EE; --ink: #18201C; --ink-2: #3A4440; --muted: #5B6560;
  --line: #DDE3DE; --line-2: #CBD3CE;
  --jade: #1F6F57; --jade-ink: #174F3F; --jade-soft: #E3F0EA; --on-jade: #FFFFFF;
  --seal: #B42318; --gold: #F2B84B; --danger: #D9473A;
  --tile: #1E2622; --dock: #18201C; --dock-btn: #2C3631; --dock-hover: #3A4641; --on-dock: #F4F6F3;
  --shadow: 0 1px 2px rgba(24, 32, 28, .06), 0 14px 36px -18px rgba(24, 32, 28, .3);
  --r: 16px; --r-sm: 11px;
  --f-ui: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-hz: 'Noto Serif SC', 'Songti SC', 'STSong', serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #19201D; --surface-2: #202825; --ink: #E8EEEA; --ink-2: #C4CEC8; --muted: #98A59F;
    --line: #2A3430; --line-2: #3A4641;
    --jade: #4FB592; --jade-ink: #9BDDC4; --jade-soft: #1D3229; --on-jade: #0B1410;
    --seal: #F0715F; --tile: #0B0F0D; --dock: #0B0F0D; --dock-btn: #202825; --dock-hover: #2E3833;
    --shadow: 0 1px 0 var(--line), 0 18px 40px -24px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) .dock { --glass: rgba(40, 50, 45, .55); --glass-2: rgba(20, 26, 23, .45); --rim: rgba(255, 255, 255, .14);
    --chip: rgba(255, 255, 255, .1); --chip-hover: rgba(255, 255, 255, .18); --chip-ink: #E8EEEA; }
  :root:not([data-theme="light"]) .dock::before { opacity: .25; }
  :root:not([data-theme="light"]) .dock button:not(.off):not(.on):not(.leave) { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14); }
  :root:not([data-theme="light"]) .dock .div { background: rgba(255, 255, 255, .14); }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #19201D; --surface-2: #202825; --ink: #E8EEEA; --ink-2: #C4CEC8; --muted: #98A59F;
  --line: #2A3430; --line-2: #3A4641;
  --jade: #4FB592; --jade-ink: #9BDDC4; --jade-soft: #1D3229; --on-jade: #0B1410;
  --seal: #F0715F; --tile: #0B0F0D; --dock: #0B0F0D; --dock-btn: #202825; --dock-hover: #2E3833;
  --shadow: 0 1px 0 var(--line), 0 18px 40px -24px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
:root[data-theme="dark"] .dock { --glass: rgba(40, 50, 45, .55); --glass-2: rgba(20, 26, 23, .45); --rim: rgba(255, 255, 255, .14);
  --chip: rgba(255, 255, 255, .1); --chip-hover: rgba(255, 255, 255, .18); --chip-ink: #E8EEEA; }
:root[data-theme="dark"] .dock::before { opacity: .25; }
:root[data-theme="dark"] .dock button:not(.off):not(.on):not(.leave) { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14); }
:root[data-theme="dark"] .dock .div { background: rgba(255, 255, 255, .14); }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-2);
  background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 500; transition: background .15s, color .15s, border-color .15s; }
button:hover:not(:disabled) { background: var(--surface-2); }
button:disabled { opacity: .35; cursor: default; }
:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
input, select { border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-sm); padding: 11px 13px; width: 100%; }
input:focus { outline: 2px solid var(--jade); outline-offset: -1px; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Icon nét (kiểu Lucide), vẽ bằng màu chữ của nút */
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tog .ic-off, .tog.off .ic-on { display: none; }
.tog.off .ic-off { display: block; }

.btn-primary { background: var(--jade); color: var(--on-jade); border-color: var(--jade); font-weight: 600; }
.btn-primary:hover:not(:disabled) { background: var(--jade-ink); }
.icon-btn { width: 38px; height: 38px; padding: 0; border-color: transparent; background: transparent; color: var(--ink-2); border-radius: 11px; }
.icon-btn.sel { background: var(--jade-soft); color: var(--jade-ink); }
.mark { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--jade); color: var(--on-jade); font: 700 19px/1 var(--f-hz); }

/* Chú thích khi rê chuột (thay cho chữ trên nút) */
@media (hover: hover) {
  [data-tip] { position: relative; }
  [data-tip]:hover::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%); z-index: 20;
    background: var(--dock); color: var(--on-dock); font-size: 12px; font-weight: 500; line-height: 1.3; padding: 5px 9px; border-radius: 7px; white-space: nowrap; pointer-events: none; }
  .tip-down[data-tip]:hover::after { bottom: auto; top: calc(100% + 8px); }
  .topbar > [data-tip]:last-child:hover::after { left: auto; right: 0; transform: none; }
}

/* Vòng xoay đang tải: trong nút "Vào lớp", trên slide đang tải, ở ô video đang nối */
.spin { display: inline-block; width: 1em; height: 1em; flex: none; vertical-align: -.15em; border-radius: 50%;
  border: 2px solid currentColor; border-right-color: transparent; animation: spin .75s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.5s; } }
button.busy { cursor: progress; }
button.busy:disabled { opacity: .85; }

/* Màn hình vào lớp */
#join { min-height: 100%; display: grid; place-items: center; padding: 24px 16px;
  background: radial-gradient(900px 480px at 50% -8%, var(--jade-soft), transparent 70%), var(--bg); }
#join form { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px; display: grid; gap: 14px; box-shadow: var(--shadow); }
#join .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 2px; }
#join .brand .mark { width: 46px; height: 46px; border-radius: 13px; font-size: 24px; }
#join h1 { margin: 0; font-size: 20px; line-height: 1.25; }
#join .hint { color: var(--muted); font-size: 13px; margin: 0; }
#join label { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
#join .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 13px; }
#join .roles label { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px; border-radius: 10px; cursor: pointer; font-size: 14px; color: var(--muted); }
#join .roles input { position: absolute; opacity: 0; pointer-events: none; }
#join .roles label:has(input:checked) { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
#join .roles label:has(input:focus-visible) { outline: 2px solid var(--jade); }
#join .err { color: var(--seal); font-size: 14px; min-height: 1em; }
#join button[type="submit"] { min-height: 48px; font-size: 16px; }
#join .back { justify-self: center; display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; text-decoration: none; }
#join .back:hover { color: var(--jade); }
#join .back .ic { width: 16px; height: 16px; }

/* Lớp học */
#app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
.topbar { display: flex; align-items: center; gap: 6px; padding: 10px 16px; }
.room { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: 6px; }
.room > span { display: grid; line-height: 1.25; min-width: 0; }
.room small { color: var(--muted); font-size: 12px; }
.room b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .grow { flex: 1; }
.net { font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.net:empty { display: none; }
.topbar .icon-btn { width: 40px; height: 40px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 50%; }
.topbar .icon-btn:hover { background: var(--surface-2); }
.topbar .icon-btn.sel { background: var(--jade-soft); color: var(--jade-ink); border-color: transparent; }
#lessonsBtn { min-height: 40px; }

main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(260px, 27vw, 340px); gap: 16px;
  padding: 0 16px calc(96px + env(safe-area-inset-bottom)); } /* chừa chỗ cho thanh điều khiển nổi */
/* bảng và thanh công cụ là một khối dính liền, canh giữa chỗ trống (fitStage tính cỡ bảng) */
.left { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; }
.view { flex: none; width: 100%; min-height: 0; position: relative; display: grid; }
.view.focus-on { flex: 1; }
.view > * { grid-area: 1 / 1; min-height: 0; }
.stage-wrap { display: grid; place-items: center; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 100%; background: #fff; border-radius: var(--r); overflow: hidden;
  box-shadow: 0 0 0 1px var(--line), var(--shadow); }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
/* slide Hán Lộ: trang bài giảng 1920×1080 nhúng vào, thu nhỏ cho vừa bảng (fitStage đặt scale) */
.stage iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; background: #fff; }
.stage canvas.drawing { cursor: crosshair; touch-action: none; }
.stage .loading { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; background: rgba(255, 255, 255, .6); color: #1F6F57; font-size: 30px; pointer-events: none; }
.stage .blank { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 8px; color: #9AA59F; font-size: 14px; pointer-events: none;
  background: radial-gradient(#DDE3DE 1.2px, transparent 1.2px) 0 0 / 22px 22px; }
.stage .blank .ic { width: 30px; height: 30px; stroke-width: 1.6; }

/* Phóng to giáo viên: camera giáo viên chiếm chỗ chính, bảng thu nhỏ ở góc nhưng vẫn chạy và vẽ được */
.focus { display: none; position: relative; background: var(--tile); border-radius: var(--r); overflow: hidden; }
.focus video { width: 100%; height: 100%; object-fit: contain; display: block; }
.focus.me video { transform: scaleX(-1); }
.focus .avatar { width: 112px; height: 112px; font-size: 44px; }
.mini-btn { display: none; position: absolute; top: 8px; left: 8px; z-index: 3; width: 32px; height: 32px; padding: 0; background: rgba(0, 0, 0, .55); color: #fff; border: 0; }
.mini-btn:hover:not(:disabled) { background: rgba(0, 0, 0, .75); }
.mini-btn .ic { width: 16px; height: 16px; }
.focus-on .focus { display: block; }
.focus-on .stage-wrap { position: absolute; right: 14px; bottom: 14px; width: min(32%, 360px); aspect-ratio: 16 / 9; z-index: 2; }
.focus-on .stage { border-radius: 12px; box-shadow: 0 0 0 2px rgba(255, 255, 255, .7), 0 10px 30px rgba(0, 0, 0, .4); }
.focus-on .mini-btn { display: grid; }
.tile.teacher { cursor: zoom-in; }
/* đang phóng to thì ô giáo viên bên phải về cỡ thường, khỏi lặp hình lớn hai lần */
.focusing .tile.teacher { grid-column: auto; aspect-ratio: 4 / 3; cursor: zoom-out; }

/* Thanh dưới bảng: chuyển slide, tiêu đề slide, công cụ vẽ */
.boardbar { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-height: 52px; padding: 6px 8px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; }
.nav { display: flex; align-items: center; gap: 2px; padding: 2px; background: var(--surface-2); border-radius: 12px; }
.nav .icon-btn { width: 34px; height: 34px; border-radius: 9px; }
.nav .icon-btn:hover:not(:disabled) { background: var(--surface); }
.page { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; min-width: 52px; text-align: center; }
.now { flex: 1 1 200px; min-width: 0; display: flex; align-items: baseline; gap: 8px; font-size: 14px; padding-left: 4px; }
.now b, .now span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now b { font-weight: 600; flex-shrink: 0; max-width: 100%; }
.now span { color: var(--muted); font-size: 13px; flex-shrink: 100; } /* chật thì tên bài co lại trước tiêu đề slide */
.drawtools { display: flex; align-items: center; gap: 2px; padding: 2px; background: var(--surface-2); border-radius: 12px; }
.drawtools .icon-btn { width: 34px; height: 34px; border-radius: 9px; }
.drawtools .icon-btn:hover:not(:disabled) { background: var(--surface); }
.drawtools .icon-btn.sel { background: var(--surface); color: var(--jade); box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
.drawtools .div { width: 1px; height: 20px; background: var(--line-2); margin: 0 4px; }
/* Chọn màu bút: nút hiện màu đang dùng, bấm mở bảng màu có sẵn + "Màu khác" (bộ chọn màu của máy) */
.colorpick { position: relative; }
#colorBtn .dot { width: 20px; height: 20px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .18); }
#colorBtn[aria-expanded="true"]::after { display: none; }
.pop { position: absolute; left: 0; bottom: calc(100% + 12px); z-index: 15; width: 204px; padding: 12px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 18px 44px -14px rgba(0, 0, 0, .4); }
#swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.swatch { width: 100%; aspect-ratio: 1; padding: 0; border: 0; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); transition: transform .12s; }
.swatch:hover:not(:disabled) { background: var(--c); transform: scale(1.08); }
.swatch.sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--c); }
.custom { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
/* vòng cầu vồng quanh màu đang chọn cho biết bấm vào là chọn màu tùy ý */
.custom input { flex: none; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
  background: conic-gradient(#f43f5e, #f59e0b, #eab308, #22c55e, #06b6d4, #3b82f6, #a855f7, #f43f5e); }
.custom input::-webkit-color-swatch-wrapper { padding: 5px; }
.custom input::-webkit-color-swatch { border: 0; border-radius: 50%; }
.custom input::-moz-color-swatch { border: 0; border-radius: 50%; }
.size i { display: block; border-radius: 50%; background: currentColor; }
.drawtools .danger:hover:not(:disabled) { color: var(--seal); }

/* Cột phải: video và bảng người học / chat */
.side { min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.videos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { position: relative; aspect-ratio: 4 / 3; background: var(--tile); border-radius: 14px; overflow: hidden; }
.tile.teacher { grid-column: 1 / -1; aspect-ratio: 16 / 9; }
.tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile.me video { transform: scaleX(-1); }
.avatar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 52px; height: 52px; border-radius: 50%;
  display: grid; place-items: center; background: var(--jade); color: #fff; font-size: 21px; font-weight: 600; }
.tile.teacher .avatar { width: 72px; height: 72px; font-size: 28px; }
.label { position: absolute; left: 8px; bottom: 8px; right: 8px; display: flex; gap: 4px; align-items: center; }
.label span { display: inline-flex; align-items: center; gap: 4px; min-width: 0; background: rgba(0, 0, 0, .55); color: #fff; font-size: 12px; font-weight: 500;
  border-radius: 999px; padding: 2px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.label .badge-ic { flex: none; width: 22px; height: 22px; padding: 0; justify-content: center; }
.label .muted-ic { background: var(--danger); }
.label .hand-ic { background: var(--gold); color: #3A2A06; }
.label .ic { width: 13px; height: 13px; stroke-width: 2.4; }
.focus .label { left: 12px; bottom: 12px; right: auto; }
.focus .label span { font-size: 14px; padding: 4px 12px; }
.tile .state { position: absolute; top: 8px; left: 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #fff;
  background: rgba(0, 0, 0, .55); border-radius: 999px; padding: 2px 8px; }

.panel { flex: 1; min-height: 240px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.tabs { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; border-radius: 10px; background: none; padding: 8px; color: var(--muted); font-size: 14px; }
.tabs button .ic { width: 18px; height: 18px; }
.tabs button.sel { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.count { font-size: 12px; color: var(--muted); font-weight: 500; }
.badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 600; }
.list { flex: 1; overflow: auto; padding: 6px 10px; }
.person { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); }
.person:last-child { border-bottom: 0; }
.person .av { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--jade-soft); color: var(--jade-ink); font-weight: 600; font-size: 14px; }
.person .av.t { background: var(--jade); color: var(--on-jade); }
.person .name { flex: 1; min-width: 0; display: grid; line-height: 1.3; }
.person .name b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person .role { font-size: 12px; color: var(--muted); }
.person .hand { color: #B7791F; }
.person .hand .ic { width: 18px; height: 18px; }
.person .acts { display: flex; gap: 2px; }
.person .acts .icon-btn { width: 32px; height: 32px; border-radius: 9px; }
.person .acts .icon-btn:hover:not(:disabled) { background: var(--surface-2); }
.person .acts .ic { width: 17px; height: 17px; }
.msg { margin: 0 0 10px; }
.msg b { font-size: 13px; font-weight: 600; }
.msg b.t { color: var(--jade); }
.msg time { color: var(--muted); font-size: 11px; margin-left: 6px; }
.msg div { width: fit-content; max-width: 100%; margin-top: 2px; padding: 6px 11px; background: var(--surface-2); border-radius: 4px 14px 14px 14px; white-space: pre-wrap; word-break: break-word; }
.empty { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 12px; margin: 0; }
.chat-form { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
.chat-form input { border-radius: 999px; padding: 9px 14px; }
.chat-form button { width: 40px; height: 40px; padding: 0; flex: none; }

/* Thanh điều khiển nổi: nút tròn chỉ có icon, tắt thì đỏ, giơ tay thì vàng */
/* Thanh điều khiển nổi kiểu "liquid glass": kính mờ trong suốt, viền sáng, vệt bóng phía trên.
   Nút chỉ có icon; tắt thì đỏ, giơ tay thì vàng; vòng sáng quanh mic chạy theo tiếng nói (--level do JS đặt) */
footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; display: flex; justify-content: center;
  padding: 0 16px calc(16px + env(safe-area-inset-bottom)); pointer-events: none; }
.dock { --glass: rgba(255, 255, 255, .5); --glass-2: rgba(255, 255, 255, .22); --rim: rgba(255, 255, 255, .75); --chip: rgba(255, 255, 255, .45);
  --chip-hover: rgba(255, 255, 255, .7); --chip-ink: var(--ink);
  pointer-events: auto; position: relative; isolation: isolate; display: flex; align-items: center; gap: 10px; padding: 9px; border-radius: 999px;
  background: linear-gradient(180deg, var(--glass), var(--glass-2));
  -webkit-backdrop-filter: blur(22px) saturate(190%); backdrop-filter: blur(22px) saturate(190%);
  border: 1px solid var(--rim);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, .9), inset 0 -1px 1px rgba(255, 255, 255, .3), inset 0 0 22px rgba(255, 255, 255, .25),
    0 18px 40px -14px rgba(24, 32, 28, .4), 0 3px 8px rgba(24, 32, 28, .1); }
/* vệt bóng cong như mặt kính */
.dock::before { content: ''; position: absolute; inset: 1px; z-index: -1; border-radius: inherit; pointer-events: none;
  background: radial-gradient(120% 70% at 50% -20%, rgba(255, 255, 255, .7), transparent 55%),
    radial-gradient(60% 50% at 50% 120%, rgba(255, 255, 255, .25), transparent 70%); }
.dock button { width: 50px; height: 50px; padding: 0; border: 0; border-radius: 50%; color: var(--chip-ink); background: var(--chip);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .85), inset 0 -1px 0 rgba(0, 0, 0, .04), 0 1px 3px rgba(24, 32, 28, .12);
  transition: background .15s, transform .15s, box-shadow .08s linear; }
.dock button:hover:not(:disabled) { background: var(--chip-hover); transform: translateY(-1px); }
.dock button:active:not(:disabled) { transform: scale(.94); }
.dock button.off, .dock button.off:hover, .dock .leave, .dock .leave:hover { background: rgba(217, 71, 58, .92); color: #fff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 4px 12px -2px rgba(217, 71, 58, .5); }
.dock button.on, .dock button.on:hover { background: rgba(242, 184, 75, .95); color: #2B1F05; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 4px 12px -2px rgba(242, 184, 75, .55); }
.dock .ic { width: 22px; height: 22px; }
.dock .div { width: 1px; height: 28px; background: rgba(24, 32, 28, .14); margin: 0 2px; }
.dock .leave { width: 68px; border-radius: 999px; }
.dock .leave:hover:not(:disabled) { background: rgba(196, 56, 44, .95); }
#mic:not(.off) { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .85), 0 1px 3px rgba(24, 32, 28, .12), 0 0 0 calc(var(--level, 0) * 7px) rgba(31, 111, 87, .45); }
/* nền có vài vệt màu nhẹ để mặt kính bắt sáng */
#app { background: radial-gradient(600px 300px at 20% 100%, rgba(31, 111, 87, .12), transparent 70%),
  radial-gradient(500px 260px at 80% 100%, rgba(242, 184, 75, .12), transparent 70%), var(--bg); }

#toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 30; background: var(--dock); color: var(--on-dock); padding: 9px 16px; border-radius: 999px;
  font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .5); }
#unlock { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 11; background: var(--jade); color: var(--on-jade);
  border: 0; padding: 13px 22px; font-size: 16px; font-weight: 600; box-shadow: 0 10px 30px -8px rgba(0, 0, 0, .45); }

/* Bảng chọn bài giảng (giáo viên): danh sách bài bên trái, các slide của bài bên phải */
#picker { width: min(880px, calc(100% - 32px)); height: min(640px, calc(100% - 48px)); padding: 0; border: 0; border-radius: 20px; background: var(--surface); color: var(--ink); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .5); }
#picker[open] { display: flex; flex-direction: column; }
#picker::backdrop { background: rgba(10, 16, 13, .5); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
#picker .head { display: flex; align-items: center; gap: 8px; padding: 14px 14px 14px 20px; border-bottom: 1px solid var(--line); }
#picker .head h2 { margin: 0; font-size: 17px; flex: 1; }
#picker .back { display: none; }
#picker .body { flex: 1; min-height: 0; display: grid; grid-template-columns: 310px 1fr; }
#picker .col { overflow: auto; padding: 10px; }
#picker .col + .col { border-left: 1px solid var(--line); background: var(--bg); }
#picker .item { display: grid; gap: 1px; width: 100%; text-align: left; justify-content: stretch; border: 0; border-radius: 11px; padding: 9px 12px; background: none; font-weight: 500; }
#picker .item:hover { background: var(--surface-2); }
#picker .col + .col .item:hover { background: var(--surface); }
#picker .item.sel { background: var(--jade-soft); color: var(--jade-ink); }
#picker .item.cur { color: var(--jade); font-weight: 600; }
#picker .item small { color: var(--muted); font-size: 12px; font-weight: 400; }
#picker .slide { grid-template-columns: 30px 1fr; align-items: baseline; }
#picker .slide small { font-size: 12px; font-variant-numeric: tabular-nums; }
#picker .slide.cur { background: var(--surface); box-shadow: inset 3px 0 var(--jade); }
#picker h3 { margin: 14px 12px 4px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
#picker h3:first-child { margin-top: 4px; }
#pickSearch { position: sticky; top: 0; z-index: 1; margin-bottom: 6px; border-radius: 999px; padding: 9px 14px; box-shadow: 0 -10px 0 var(--surface), 0 6px 0 var(--surface); }

.short { display: none; }
@media (max-width: 820px) {
  #app { height: auto; min-height: 100%; }
  .topbar { padding: 8px 10px; gap: 4px; }
  .room small { display: none; }
  .room .mark { width: 32px; height: 32px; font-size: 17px; }
  .net { display: none; }
  .long { display: none; }
  .short { display: inline; }
  main { grid-template-columns: 1fr; padding-left: 8px; padding-right: 8px; gap: 10px; }
  .view { display: block; }
  .stage-wrap { display: block; }
  .focus-on .focus { aspect-ratio: 4 / 3; }
  .focus-on .stage-wrap { right: 8px; bottom: 8px; width: 46%; }
  .focusing .tile.teacher { grid-column: auto; }
  /* tiêu đề slide lên một dòng riêng phía trên nút chuyển slide và công cụ vẽ */
  .now { flex-basis: 100%; order: -1; flex-wrap: wrap; gap: 0 8px; padding: 2px 4px 0; }
  .now b { white-space: normal; }
  .drawtools { flex-wrap: wrap; }
  .videos { grid-template-columns: repeat(3, 1fr); }
  .tile.teacher { grid-column: span 3; }
  .avatar { width: 40px; height: 40px; font-size: 17px; }
  .panel { min-height: 300px; }
  main { padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
  .left { align-items: stretch; }
  footer { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  .dock { gap: 8px; padding: 7px; }
  .dock button { width: 46px; height: 46px; }
  .dock .leave { width: 58px; }
  .dock .div { display: none; }
  /* điện thoại: một cột, chọn bài rồi mới thấy slide của bài đó */
  #picker { width: 100%; height: 100%; max-width: none; max-height: none; border-radius: 0; }
  #picker .body { grid-template-columns: 1fr; }
  #picker .col + .col { border-left: 0; }
  #picker.slides .lessons, #picker:not(.slides) .slides-col { display: none; }
  #picker.slides .back { display: inline-flex; }
}

/* ---------- Kính (liquid glass) ----------
   Mặc định bật; <html data-glass="off"> (glass.js) thì về giao diện đặc như cũ. Lấy biến của react-liquis-glass,
   có giá trị dự phòng khi không tải được /glass/. Video, slide giữ nền đặc. */
:root {
  --gl-bg: var(--lg-glass-bg-strong, rgba(255, 255, 255, .62)); --gl-bg-soft: var(--lg-glass-bg-hover, rgba(255, 255, 255, .46));
  --gl-border: var(--lg-glass-border, rgba(255, 255, 255, .6)); --gl-edge: var(--lg-glass-edge, rgba(255, 255, 255, .9));
  --gl-edge-low: var(--lg-glass-edge-low, rgba(255, 255, 255, .25));
  --gl-sheen: linear-gradient(145deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, .06) 45%, rgba(255, 255, 255, .14));
  --gl-shadow: 0 12px 32px -14px rgba(24, 32, 28, .28), 0 2px 6px rgba(24, 32, 28, .06);
  --gl-fill: rgba(24, 32, 28, .06); --gl-line: rgba(24, 32, 28, .09);
  --gl-blob-1: rgba(31, 111, 87, .2); --gl-blob-2: rgba(242, 184, 75, .2);
  --gl-blur: blur(var(--lg-blur, 22px)) saturate(var(--lg-saturate, 190%));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --gl-bg: rgba(25, 32, 29, .62); --gl-bg-soft: rgba(255, 255, 255, .08); --gl-border: rgba(255, 255, 255, .12);
    --gl-edge: rgba(255, 255, 255, .16); --gl-edge-low: rgba(255, 255, 255, .04);
    --gl-sheen: linear-gradient(145deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .01) 45%, rgba(255, 255, 255, .03));
    --gl-shadow: 0 18px 40px -20px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .25);
    --gl-fill: rgba(255, 255, 255, .06); --gl-line: rgba(255, 255, 255, .08);
    --gl-blob-1: rgba(79, 181, 146, .14); --gl-blob-2: rgba(242, 184, 75, .08);
  }
}
:root[data-theme="dark"] {
  --gl-bg: rgba(25, 32, 29, .62); --gl-bg-soft: rgba(255, 255, 255, .08); --gl-border: rgba(255, 255, 255, .12);
  --gl-edge: rgba(255, 255, 255, .16); --gl-edge-low: rgba(255, 255, 255, .04);
  --gl-sheen: linear-gradient(145deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .01) 45%, rgba(255, 255, 255, .03));
  --gl-shadow: 0 18px 40px -20px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .25);
  --gl-fill: rgba(255, 255, 255, .06); --gl-line: rgba(255, 255, 255, .08);
  --gl-blob-1: rgba(79, 181, 146, .14); --gl-blob-2: rgba(242, 184, 75, .08);
}

/* nền có vệt màu ngọc bích và vàng để mặt kính bắt màu */
:root:not([data-glass="off"]) #join {
  background: radial-gradient(640px 420px at 18% 8%, var(--gl-blob-1), transparent 70%),
    radial-gradient(560px 380px at 86% 92%, var(--gl-blob-2), transparent 70%),
    radial-gradient(900px 480px at 50% -8%, var(--jade-soft), transparent 70%), var(--bg); }
:root:not([data-glass="off"]) #app {
  background: radial-gradient(700px 380px at 10% -6%, var(--gl-blob-1), transparent 70%),
    radial-gradient(620px 340px at 94% 6%, var(--gl-blob-2), transparent 70%),
    radial-gradient(600px 300px at 20% 100%, var(--gl-blob-1), transparent 70%),
    radial-gradient(500px 260px at 80% 100%, var(--gl-blob-2), transparent 70%), var(--bg); }

/* mặt kính: thanh trên, thanh dưới bảng, bảng người học/chat, bảng màu, chọn bài, thẻ vào lớp */
:root:not([data-glass="off"]) :is(.topbar, .boardbar, .panel, .pop, #picker, #join form) {
  background: var(--gl-sheen), var(--gl-bg);
  -webkit-backdrop-filter: var(--gl-blur); backdrop-filter: var(--gl-blur);
  border-color: var(--gl-border);
  box-shadow: inset 0 1px .5px var(--gl-edge), inset 0 -1px 1px var(--gl-edge-low), var(--gl-shadow); }
:root:not([data-glass="off"]) .topbar { margin: 10px 16px 12px; padding: 8px 10px 8px 12px; border: 1px solid var(--gl-border); border-radius: 18px; position: relative; z-index: 5; }
:root:not([data-glass="off"]) .topbar .icon-btn:not(.sel),
:root:not([data-glass="off"]) .join-glass {
  background: var(--gl-bg-soft); border-color: var(--gl-border); box-shadow: inset 0 1px 0 var(--gl-edge-low), 0 1px 2px rgba(24, 32, 28, .08); }
:root:not([data-glass="off"]) .topbar .icon-btn:not(.sel):hover,
:root:not([data-glass="off"]) .join-glass:hover { background: var(--gl-bg); }
:root:not([data-glass="off"]) .net,
:root:not([data-glass="off"]) .nav,
:root:not([data-glass="off"]) .drawtools,
:root:not([data-glass="off"]) #join .roles,
:root:not([data-glass="off"]) .tabs button.sel,
:root:not([data-glass="off"]) .msg div { background: var(--gl-fill); }
:root:not([data-glass="off"]) :is(.tabs, .person, .chat-form, .custom, #picker .head) { border-color: var(--gl-line); }
:root:not([data-glass="off"]) #picker .col + .col { background: var(--gl-fill); border-color: var(--gl-line); }
:root:not([data-glass="off"]) #picker .item:not(.sel):hover { background: var(--gl-fill); }
:root:not([data-glass="off"]) #picker .col + .col .item:not(.sel):hover { background: var(--gl-bg-soft); }
/* bảng màu nằm trong thanh đã nhòe nên không nhòe được slide phía sau: cho đặc hơn để màu bút dễ nhìn */
:root:not([data-glass="off"]) .pop { background: var(--gl-sheen), color-mix(in srgb, var(--surface) 86%, transparent); }
:root:not([data-glass="off"]) #picker::backdrop { background: rgba(10, 16, 13, .36); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
/* bảng chọn bài nằm đè lên slide nhiều màu: cho đặc hơn để chữ nhỏ vẫn rõ */
:root:not([data-glass="off"]) #picker { background: var(--gl-sheen), color-mix(in srgb, var(--surface) 82%, transparent); }
/* ô tìm bài dính sát mép trên khi cuộn (dải che màu đặc cũ sẽ lộ ra trên nền kính) */
:root:not([data-glass="off"]) #pickSearch { top: -10px; box-shadow: none; }
:root:not([data-glass="off"]) #toast { background: rgba(24, 32, 28, .8); -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 10px 30px -10px rgba(0, 0, 0, .5); }
/* thanh điều khiển nổi vốn đã là kính: chỉ lấy độ nhòe và viền của thư viện */
:root:not([data-glass="off"]) .dock { -webkit-backdrop-filter: var(--gl-blur); backdrop-filter: var(--gl-blur); }

/* Tắt kính: thanh điều khiển thành mặt đặc, không nhòe */
:root[data-glass="off"] .dock { --chip: var(--surface-2); --chip-hover: var(--line); --chip-ink: var(--ink);
  background: var(--surface); border-color: var(--line); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: var(--shadow); }
:root[data-glass="off"] .dock::before { display: none; }
:root[data-glass="off"] .dock .div { background: var(--line-2); }

/* Nút bật/tắt kính: ở thanh trên (trong lớp) và góc màn hình vào lớp; chỉ hiện khi có glass.js */
.glass-toggle .ic { transition: color .15s, opacity .15s; }
.glass-toggle[aria-pressed="true"] .ic { color: var(--jade); }
.glass-toggle[aria-pressed="false"] .ic { opacity: .55; }
.topbar .glass-btn { width: auto; min-width: 40px; padding: 0 14px 0 11px; gap: 6px; border-radius: 999px; font-size: 14px; }
#join { position: relative; }
.join-glass { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 14px; gap: 6px; padding: 6px 13px 6px 10px; font-size: 13px; color: var(--ink-2); }
.join-glass .ic { width: 17px; height: 17px; }
@media (max-width: 820px) {
  .topbar .glass-btn { padding: 0; }
  :root:not([data-glass="off"]) .topbar { margin: 8px 8px 10px; padding: 6px 8px; border-radius: 16px; }
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/ably@2.28.0/build/ably.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const FAKE = params.has('fake');   // ?fake=1: camera giả để thử nhiều tab trên một máy
const LOCAL = params.has('local'); // ?local=1: các tab nói chuyện với nhau qua BroadcastChannel, không cần Ably
const API = `/api/${params.get('api') === 'go' ? 'go' : 'node'}/lop-hoc`;
// Chỉ STUN thì hai máy khác mạng (4G, wifi công ty/trường) hay không thấy nhau: server trả thêm TURN cùng token Ably
let ICE = [{ urls: 'stun:stun.l.google.com:19302' }];
const COLORS = ['#1f1d1a', '#c0392b', '#e67e22', '#f1c40f', '#2f7d4f', '#1e6fd9', '#7e3fbf', '#db2777'];
const MAX_PEOPLE = 6;
const CHUNK = 30000; // gửi nét vẽ cho người mới theo từng gói ~30 KB (Ably giới hạn cỡ một tin nhắn)

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

let net, me, people = new Map(), lessons = [];
let local = new MediaStream(), facing = 'user';
const peers = new Map(); // id → { pc, stream, queue: [] }
const state = { lesson: null, slide: 0, mic: true, cam: true, hand: false };
const pages = new Map(); // "bai21:3" → Map(id → nét vẽ): giữ nét của mọi trang để người vào sau nhận lại
let drawers = new Set(); // học sinh được giáo viên giao bút
const chatLog = [];

function toast(text, ms = 2500) {
  const t = $('#toast');
  t.textContent = text;
  t.classList.remove('hidden');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.add('hidden'), ms);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const roleOf = id => id.startsWith('gv-') ? 'teacher' : 'student';
const isTeacher = (id = me?.id) => !!id && roleOf(id) === 'teacher';
const canDraw = (id = me?.id) => isTeacher(id) || drawers.has(id);
const randomId = () => [...crypto.getRandomValues(new Uint8Array(12))].map(b => (b % 36).toString(36)).join('');

/* ---------- Kênh liên lạc ---------- */
// Mỗi phòng một kênh Ably "lop:<phòng>". Token do /api/<node|go>/lop-hoc ký, gắn clientId vào mọi tin nhắn:
// "gv-…" chắc chắn là giáo viên, nên lệnh đổi slide, tắt mic, giao bút chỉ nhận khi đến từ "gv-…".
async function connectAbly(room, clientId, pass) {
  const getToken = async ice => {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ room, clientId, pass, ice }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `Máy chủ lỗi (${r.status})`);
    const { iceServers, ...token } = j;
    if (Array.isArray(iceServers) && iceServers.length) ICE = iceServers;
    return token;
  };
  let first = await getToken(true); // xin trước để báo lỗi (sai mật khẩu…) ngay ở màn hình vào lớp
  const client = new Ably.Realtime({
    clientId, echoMessages: false,
    authCallback: (_, cb) => {
      if (first) { const t = first; first = null; return cb(null, t); }
      getToken().then(t => cb(null, t), err => cb(err.message, null)); // token hết hạn thì xin lại
    }
  });
  await new Promise((ok, bad) => {
    const fail = msg => { client.close(); bad(new Error(msg)); };
    const timer = setTimeout(() => fail('Không kết nối được, kiểm tra lại mạng'), 15000);
    client.connection.once('connected', () => { clearTimeout(timer); ok(); });
    client.connection.once('failed', s => { clearTimeout(timer); fail(s.reason?.message || 'Không kết nối được Ably'); });
  });
  const ch = client.channels.get('lop:' + room);
  return {
    publish: (type, data) => ch.publish(type, data).catch(err => console.warn('gửi lỗi', type, err)),
    listen: cb => ch.subscribe(m => cb(m.name, m.data, m.clientId)),
    watch: cb => ch.presence.subscribe(m => cb(m.action, { id: m.clientId, ...m.data })),
    members: async () => (await ch.presence.get()).map(m => ({ id: m.clientId, ...m.data })),
    enter: data => ch.presence.enter(data),
    update: data => ch.presence.update(data),
    onState: cb => client.connection.on(s => cb(s.current)),
    close: () => client.close()
  };
}

// Bản thử không cần Ably: các tab cùng trình duyệt nói chuyện qua BroadcastChannel, có nhịp tim thay cho presence
function connectLocal(room, clientId) {
  const bc = new BroadcastChannel('lop-hoc:' + room);
  const seen = new Map(); // id → { data, at }
  let mine = null, onMsg = () => {}, onPres = () => {};
  const post = (kind, body = {}) => bc.postMessage({ kind, from: clientId, ...body });
  bc.onmessage = ({ data: m }) => {
    if (m.kind === 'msg') return onMsg(m.type, m.data, m.from);
    if (m.kind === 'who') return mine && post('here', { data: mine });
    if (m.kind === 'leave') { if (seen.delete(m.from)) onPres('leave', { id: m.from, ...m.data }); return; }
    const isNew = !seen.has(m.from);
    seen.set(m.from, { data: m.data, at: Date.now() });
    if (isNew) onPres('enter', { id: m.from, ...m.data });
    else if (m.kind === 'update') onPres('update', { id: m.from, ...m.data });
  };
  const beat = setInterval(() => {
    if (mine) post('here', { data: mine });
    for (const [id, v] of seen) if (Date.now() - v.at > 6000) { seen.delete(id); onPres('leave', { id, ...v.data }); }
  }, 2000);
  const leave = () => mine && post('leave', { data: mine });
  addEventListener('pagehide', leave);
  return {
    publish: (type, data) => post('msg', { type, data }),
    listen: cb => { onMsg = cb; },
    watch: cb => { onPres = cb; },
    members: () => new Promise(ok => { post('who'); setTimeout(() => ok([...seen].map(([id, v]) => ({ id, ...v.data }))), 500); }),
    enter: data => { mine = data; post('here', { data }); },
    update: data => { mine = data; post('update', { data }); },
    onState: () => {},
    close: () => { leave(); clearInterval(beat); bc.close(); }
  };
}

/* ---------- Vào lớp ---------- */
const form = $('#join form');
form.name.value = store.get('lop-name') || '';
if (params.get('room')) form.room.value = params.get('room');
form.addEventListener('change', () => $('.pass').classList.toggle('hidden', form.role.value !== 'teacher'));
form.addEventListener('submit', async e => {
  e.preventDefault();
  const btn = form.querySelector('button');
  const err = $('#join .err');
  const room = form.room.value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 32);
  const name = form.name.value.trim().slice(0, 30);
  if (!room || !name) { err.textContent = 'Cần nhập tên và mã phòng (chữ không dấu, số)'; return; }
  btn.disabled = true; btn.classList.add('busy');
  btn.innerHTML = '<span class="spin" aria-hidden="true"></span>Đang vào lớp…';
  err.textContent = '';
  store.set('lop-name', name);
  const clientId = (form.role.value === 'teacher' ? 'gv-' : 'hs-') + randomId();
  try {
    net = LOCAL ? connectLocal(room, clientId) : await connectAbly(room, clientId, form.pass.value);
    await net.listen(onMessage);
    await net.watch(onPresence);
    const others = (await net.members()).filter(p => p.id !== clientId);
    if (others.length >= MAX_PEOPLE) throw new Error(`Phòng đã đủ ${MAX_PEOPLE} người`);
    await startMedia(name);
    me = { id: clientId, name, role: roleOf(clientId) };
    form.room.value = room;
    err.textContent = '';
    await enter();
  } catch (ex) {
    err.textContent = ex.message || String(ex);
    net?.close();
    net = null;
  } finally { btn.disabled = false; btn.classList.remove('busy'); btn.textContent = 'Vào lớp'; }
});

/* ---------- Camera / mic ---------- */
function fakeStream(label) {
  const c = Object.assign(document.createElement('canvas'), { width: 480, height: 360 });
  const g = c.getContext('2d');
  const hue = Math.floor(Math.random() * 360);
  (function frame() {
    g.fillStyle = `hsl(${hue} 45% 35%)`; g.fillRect(0, 0, 480, 360);
    g.fillStyle = '#fff'; g.font = '32px system-ui'; g.textAlign = 'center';
    g.fillText(label, 240, 170); g.font = '20px system-ui';
    g.fillText(new Date().toLocaleTimeString('vi-VN'), 240, 210);
    setTimeout(frame, 200);
  })();
  const ac = new AudioContext();
  const dest = ac.createMediaStreamDestination();
  const osc = ac.createOscillator(), gain = ac.createGain();
  gain.gain.value = 0; osc.connect(gain).connect(dest); osc.start();
  return new MediaStream([...c.captureStream(10).getVideoTracks(), ...dest.stream.getAudioTracks()]);
}

async function startMedia(name) {
  if (FAKE) { local = fakeStream(name); return; }
  try {
    local = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
      video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { max: 20 }, facingMode: facing }
    });
  } catch {
    // không có camera hoặc bị từ chối: thử chỉ mic, rồi tới không có gì (vẫn xem và nghe được)
    try { local = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { local = new MediaStream(); }
    toast('Không mở được camera' + (local.getAudioTracks().length ? '' : ' và mic') + ' — vẫn vào lớp để xem và nghe được', 4000);
  }
  state.cam = !!local.getVideoTracks().length;
  state.mic = !!local.getAudioTracks().length;
}
const track = kind => (kind === 'audio' ? local.getAudioTracks() : local.getVideoTracks())[0] || null;

// Gắn track mới (bật camera lần đầu, đổi camera trước/sau) cho mọi kết nối mà không cần thương lượng lại
function replaceEverywhere(kind, t) {
  for (const { pc } of peers.values())
    for (const tr of pc.getTransceivers())
      if (tr.receiver.track.kind === kind) tr.sender.replaceTrack(t);
}

async function toggle(kind) {
  let t = track(kind);
  const key = kind === 'audio' ? 'mic' : 'cam';
  if (!t && !FAKE) {
    try {
      const s = await navigator.mediaDevices.getUserMedia(kind === 'audio' ? { audio: true } : { video: { facingMode: facing, width: { ideal: 640 } } });
      t = s.getTracks()[0];
      local.addTrack(t);
      replaceEverywhere(kind, t);
      if (kind === 'audio') watchMic();
      state[key] = true;
      return refreshMe(true);
    } catch { return toast(kind === 'audio' ? 'Không mở được mic' : 'Không mở được camera'); }
  }
  if (!t) return;
  t.enabled = !t.enabled;
  state[key] = t.enabled;
  refreshMe(true);
}

async function flip() {
  facing = facing === 'user' ? 'environment' : 'user';
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 640 } } });
    const old = track('video');
    const t = s.getVideoTracks()[0];
    if (old) { local.removeTrack(old); old.stop(); }
    local.addTrack(t);
    replaceEverywhere('video', t);
    state.cam = true;
    refreshMe(true);
  } catch { toast('Không đổi được camera'); }
}

// Nút chỉ có icon: chữ nằm ở aria-label (trình đọc màn hình) và data-tip (chú thích khi rê chuột)
const ic = name => `<svg class="ic" aria-hidden="true"><use href="#i-${name}"/></svg>`;
function tip(el, text) { el.setAttribute('aria-label', text); el.dataset.tip = text; }
const initial = name => name.trim().split(/\s+/).pop().slice(0, 1).toUpperCase();
function paintButtons() {
  $('#mic').classList.toggle('off', !state.mic);
  tip($('#mic'), state.mic ? 'Tắt mic (M)' : 'Bật mic (M)');
  $('#cam').classList.toggle('off', !state.cam);

// Mic thông minh: vòng sáng quanh nút mic chạy theo tiếng nói; đang tắt mic mà nói thì nhắc bật.
// Đo trên bản sao của track mic: bản sao luôn bật nên vẫn nghe được cả khi mic đang tắt (không gửi đi đâu).
let meter = null;
function watchMic() {
  meter?.stop();
  const t = track('audio');
  if (!t || !window.AudioContext) return;
  const probe = t.clone(), ac = new AudioContext(), an = ac.createAnalyser();
  an.fftSize = 512;
  ac.createMediaStreamSource(new MediaStream([probe])).connect(an);
  const buf = new Uint8Array(an.fftSize);
  let raf = 0, loudSince = 0, warned = -Infinity;
  (function tick(now) {
    an.getByteTimeDomainData(buf);
    let sum = 0;
    for (const v of buf) sum += ((v - 128) / 128) ** 2;
    const level = Math.min(1, Math.sqrt(sum / buf.length) * 6);
    $('#mic').style.setProperty('--level', state.mic ? level.toFixed(2) : 0);
    if (!state.mic && level > .25) {
      loudSince ||= now;
      if (now - loudSince > 900 && now - warned > 20000) { warned = now; toast('Bạn đang tắt mic — bấm M hoặc nút mic để bật', 3500); }
    } else loudSince = 0;
    raf = requestAnimationFrame(tick);
  })(performance.now());
  meter = { stop() { cancelAnimationFrame(raf); probe.stop(); ac.close(); } };
}

/* ---------- WebRTC: mỗi người nối thẳng với từng người khác ---------- */
const signal = (to, data) => net.publish('signal', { to, data });
function peer(id) {
  if (peers.has(id)) return peers.get(id);
  const pc = new RTCPeerConnection({ iceServers: ICE });
  const p = { pc, stream: new MediaStream(), queue: [] };
  peers.set(id, p);
  pc.onicecandidate = e => e.candidate && signal(id, { candidate: e.candidate.toJSON() });
  pc.ontrack = e => { p.stream.addTrack(e.track); renderTile(id); };
  pc.onconnectionstatechange = () => {
    renderTile(id);
    clearTimeout(p.retry);
    if (pc.connectionState === 'failed') restart(id).catch(err => console.warn('nối lại lỗi', err));
    // chập chờn quá vài giây (đổi wifi ↔ 4G…) thì cũng nối lại, không chờ tới lúc trình duyệt báo hỏng hẳn
    if (pc.connectionState === 'disconnected') p.retry = setTimeout(() => restart(id).catch(() => {}), 6000);
  };
  return p;
}

// Kết nối hỏng: người gọi gửi offer mới có iceRestart, người kia trả lời như một offer thường.
// (Chỉ gọi pc.restartIce() mà không ai gửi offer thì kết nối hỏng luôn.)
async function restart(id) {
  const p = peers.get(id);
  if (!p || me.id > id || p.pc.signalingState !== 'stable' || p.pc.connectionState === 'connected') return;
  await p.pc.setLocalDescription(await p.pc.createOffer({ iceRestart: true }));
  signal(id, { sdp: { type: p.pc.localDescription.type, sdp: p.pc.localDescription.sdp } });
}

// Hai người biết nhau (qua presence) thì người có mã nhỏ hơn gọi, nên không bao giờ hai bên gọi cùng lúc
async function call(id) {
  if (peers.has(id)) return;
  const { pc } = peer(id);
  for (const kind of ['audio', 'video']) {
    const tr = pc.addTransceiver(kind, { direction: 'sendrecv' });
    await tr.sender.replaceTrack(track(kind));
  }
  await pc.setLocalDescription(await pc.createOffer());
  signal(id, { sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } });
}
const meet = id => { if (me.id < id) call(id).catch(err => console.warn('gọi lỗi', err)); };

async function onSignal(from, data) {
  const p = peer(from), pc = p.pc;
  if (data.sdp) {
    await pc.setRemoteDescription(data.sdp);
    if (data.sdp.type === 'offer') {
      for (const tr of pc.getTransceivers()) {
        tr.direction = 'sendrecv';
        await tr.sender.replaceTrack(track(tr.receiver.track.kind));
      }
      await pc.setLocalDescription(await pc.createAnswer());
      signal(from, { sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } });
    }
    for (const c of p.queue.splice(0)) await pc.addIceCandidate(c).catch(() => {});
  } else if (data.candidate) {
    if (pc.remoteDescription) await pc.addIceCandidate(data.candidate).catch(() => {});
    else p.queue.push(data.candidate);
  }
}

function drop(id) {
  peers.get(id)?.pc.close();
  peers.delete(id);
  document.getElementById('tile-' + id)?.remove();

/* ---------- Slide + bảng vẽ ---------- */
const stage = $('#stage'), board = $('#board'), ctx = board.getContext('2d');
for (const el of [$('#slide'), $('#frame')]) for (const ev of ['load', 'error']) el.addEventListener(ev, () => $('#slideLoad').classList.add('hidden'));
let color = COLORS[1], width = 4, erasing = false;
const pageKey = () => `${state.lesson || 'trang'}:${state.slide}`;
const page = key => { if (!pages.has(key)) pages.set(key, new Map()); return pages.get(key); };

function fitStage() {
  // Bảng 16:9 to nhất vừa chỗ trống, thanh công cụ dính ngay dưới và rộng bằng bảng.
  // Đang phóng to giáo viên thì bảng nằm gọn ở góc, cỡ do CSS quyết định.
  const view = $('#view'), left = view.parentElement, bar = $('.boardbar');
  if (innerWidth > 820 && !view.classList.contains('focus-on')) {
    // thanh công cụ có thể xuống dòng khi hẹp lại nên tính hai lượt cho chiều cao thanh khớp bề rộng mới
    for (let i = 0; i < 2; i++) {
      const w = Math.max(240, Math.min(left.clientWidth, (left.clientHeight - bar.offsetHeight - 10) * 16 / 9));
      stage.style.width = bar.style.width = w + 'px';
      view.style.height = w * 9 / 16 + 'px';
    }
  } else {
    stage.style.width = '100%';
    bar.style.width = view.style.height = '';
  }
  $('#frame').style.transform = `scale(${stage.clientWidth / 1920})`;
  const dpr = devicePixelRatio || 1;
  board.width = Math.round(stage.clientWidth * dpr);
  board.height = Math.round(stage.clientHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
new ResizeObserver(fitStage).observe($('.left'));

function seg(s, from) {
  const W = stage.clientWidth, H = stage.clientHeight, pts = s.points;
  if (!pts.length) return;
  ctx.save();
  ctx.globalCompositeOperation = s.color === 'erase' ? 'destination-out' : 'source-over';
  ctx.strokeStyle = ctx.fillStyle = s.color === 'erase' ? '#000' : s.color;
  ctx.lineWidth = s.width * W / 1000;
  ctx.lineCap = ctx.lineJoin = 'round';
  if (pts.length === 1) {
    ctx.beginPath(); ctx.arc(pts[0][0] * W, pts[0][1] * H, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath();
    const a = Math.max(0, from - 1);
    ctx.moveTo(pts[a][0] * W, pts[a][1] * H);
    for (let i = a + 1; i < pts.length; i++) ctx.lineTo(pts[i][0] * W, pts[i][1] * H);
    ctx.stroke();
  }
  ctx.restore();
}
function redraw() {
  ctx.clearRect(0, 0, stage.clientWidth, stage.clientHeight);
  for (const s of page(pageKey()).values()) seg(s, 0);
}

function showPage() {
  const { lesson, slide } = state;

  const img = $('#slide'), frame = $('#frame'), isFrame = L?.kind === 'frame';

      // vòng xoay chỉ hiện ở lần tải app đầu tiên

        $('#slideLoad').classList.toggle('hidden', !!frame.dataset.src);
        frame.dataset.src = src; frame.src = src;
      }
    // slide ảnh mới chưa có trong bộ nhớ đệm thì hiện vòng xoay tới khi ảnh về
    } else if (img.getAttribute('src') !== src) { img.src = src; $('#slideLoad').classList.toggle('hidden', img.complete); }

}

/* ---------- Chọn bài giảng: nút riêng ở thanh trên, mở bảng có tên bài và tiêu đề từng slide ---------- */
const lessonTitle = L => L.title || L.id.replace('bai', 'Bài ');
const slideTitle = (L, i) => L.titles?.[i] || `Slide ${i + 1}`;
let browsing = null; // bài đang xem trong bảng chọn (chưa chắc là bài đang chiếu)
let query = '';
// tìm không dấu: "xin chao" khớp "Xin chào"
const fold = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
function renderPicker() {
  const picker = $('#picker');
  const B = lessons.find(l => l.id === browsing);
  picker.classList.toggle('slides', !!B);
  // bài của Hán Lộ (HSK 1–3) và HSK 6 của Ngọc, chia nhóm theo cấp
  const q = fold(query.trim());

  const count = g => lessons.filter(l => l.group === g).length;

    if (l.group !== group) { group = l.group; list += `<h3>${esc(group || 'Khác')}${l.source ? ' · ' + esc(l.source) : ''} · ${count(group)} bài</h3>`; }
    list += `<button type="button" class="item${l.id === browsing ? ' sel' : ''}${l.id === state.lesson ? ' cur' : ''}" data-lesson="${l.id}">
      ${esc(lessonTitle(l))}<small>${l.zh ? esc(l.zh) + ' · ' : ''}${l.slides.length} slide${l.id === state.lesson ? ' · đang chiếu' : ''}</small></button>`;
  }
  if (!lessons.length) list += '<p class="empty">Chưa có bài nào có slide.</p>';
  else if (!shown.length) list += `<p class="empty">Không thấy bài nào khớp “${esc(query.trim())}”.</p>`;
  $('#pickLessons').innerHTML = list;
  if (!B) { $('#pickSlides').innerHTML = '<p class="empty">Chọn một bài bên trái để xem các slide.</p>'; return; }
  // gom slide theo phần (Mở đầu, Từ mới, Bài khóa…) để dễ tìm
  let html = '', section = null;
  B.slides.forEach((_, i) => {
    const sec = B.sections?.[i] || '';
    if (sec !== section) { section = sec; if (sec) html += `<h3>${esc(sec)}</h3>`; }
    const cur = B.id === state.lesson && i === state.slide;
    html += `<button type="button" class="item slide${cur ? ' cur' : ''}" data-slide="${i}"><small>${i + 1}</small>${esc(slideTitle(B, i))}</button>`;
  });
  $('#pickSlides').innerHTML = html;
  $('#pickSlides .cur')?.scrollIntoView({ block: 'center' });
}
function openPicker() {
  browsing = state.lesson;
  query = $('#pickSearch').value = '';
  renderPicker();
  $('#picker').showModal();
  // điện thoại: đang chiếu bài nào thì mở thẳng danh sách slide của bài đó; máy tính thì cuộn tới bài đang chiếu
  $('#pickLessons .cur')?.scrollIntoView({ block: 'nearest' });
}
$('#lessonsBtn').addEventListener('click', openPicker);
$('#pickSearch').addEventListener('input', e => { query = e.target.value; renderPicker(); });
$('#picker .close').addEventListener('click', () => $('#picker').close());
$('#picker .back').addEventListener('click', () => { browsing = null; renderPicker(); });
$('#picker').addEventListener('click', e => {
  if (e.target === $('#picker')) return $('#picker').close(); // bấm ra ngoài khung
  const l = e.target.closest('[data-lesson]'), s = e.target.closest('[data-slide]');
  if (l && !l.dataset.lesson) { go(null, 0); $('#picker').close(); }
  else if (l) { browsing = l.dataset.lesson; renderPicker(); }
  else if (s) { go(browsing, Number(s.dataset.slide)); $('#picker').close(); }
});

addEventListener('keydown', e => {
  if (!me || !isTeacher() || $('#picker').open || e.target.closest('input, select, textarea')) return;
  if (e.key === 'ArrowLeft' && !$('#prev').disabled) go(state.lesson, state.slide - 1);
  if (e.key === 'ArrowRight' && !$('#next').disabled) go(state.lesson, state.slide + 1);
});

// Vẽ: gửi điểm theo lô 10 lần/giây — đủ để người xem thấy nét chạy mà tốn ít tin nhắn
let drawing = null, pending = [], seq = 0, flushTimer = null;
const pos = e => {
  const r = stage.getBoundingClientRect();
  return [+((e.clientX - r.left) / r.width).toFixed(4), +((e.clientY - r.top) / r.height).toFixed(4)];
};
function flush() {
  clearTimeout(flushTimer);
  flushTimer = null;
  if (drawing && pending.length) net.publish('s:pts', { page: drawing.page, id: drawing.id, points: pending.splice(0) });
}
function startStroke(p) {
  drawing = { id: `${me.id}-${++seq}`, by: me.id, page: pageKey(), color: erasing ? 'erase' : color,
    width: erasing ? 30 : width, points: [p] };
  page(drawing.page).set(drawing.id, drawing);
  seg(drawing, 0);
  net.publish('s:start', { id: drawing.id, page: drawing.page, color: drawing.color, width: drawing.width, points: [p] });
}
board.addEventListener('pointerdown', e => {
  if (!canDraw() || (e.pointerType === 'mouse' && e.button !== 0)) return;
  try { board.setPointerCapture(e.pointerId); } catch {}
  startStroke(pos(e));
});
board.addEventListener('pointermove', e => {
  if (!drawing) return;
  const co = e.getCoalescedEvents?.() || [];
  const from = drawing.points.length;
  for (const ev of co.length ? co : [e]) { const p = pos(ev); drawing.points.push(p); pending.push(p); }
  seg(drawing, from);
  // nét quá dài thì cắt thành nét mới để mỗi nét vừa một tin nhắn khi gửi cho người vào sau
  if (drawing.points.length > 1000) { const last = drawing.points.at(-1); flush(); startStroke(last); }
  flushTimer ||= setTimeout(flush, 100);
});
const endStroke = () => { if (!drawing) return; flush(); drawing = null; };
board.addEventListener('pointerup', endStroke);
board.addEventListener('pointercancel', endStroke);

$('#swatches').innerHTML = COLORS.map(c => `<button type="button" class="swatch" data-c="${c}" style="--c:${c}" aria-label="Màu ${c}"></button>`).join('');
function pickTool() {
  document.querySelectorAll('.swatch').forEach(b => b.classList.toggle('sel', b.dataset.c === color));
  $('#colorBtn').style.setProperty('--c', color);
  $('#colorBtn').classList.toggle('sel', !erasing);
  $('#colorInput').value = color;
  $('#eraser').classList.toggle('sel', erasing);
  document.querySelectorAll('.size').forEach(b => b.classList.toggle('sel', Number(b.dataset.w) === width));
}
// Bảng màu: màu có sẵn hoặc "Màu khác…" (bộ chọn màu của máy); chọn màu là thôi tẩy, quay về bút
const colorPop = open => { $('#colorPop').classList.toggle('hidden', !open); $('#colorBtn').setAttribute('aria-expanded', open); };
const setColor = c => { color = c; erasing = false; pickTool(); };
$('#colorBtn').addEventListener('click', () => { erasing = false; pickTool(); colorPop($('#colorPop').classList.contains('hidden')); });
$('#swatches').addEventListener('click', e => { const b = e.target.closest('.swatch'); if (b) { setColor(b.dataset.c); colorPop(false); } });
$('#colorInput').addEventListener('input', e => setColor(e.target.value));
$('#colorInput').addEventListener('change', () => colorPop(false));
addEventListener('pointerdown', e => { if (!e.target.closest('.colorpick')) colorPop(false); });
addEventListener('keydown', e => { if (e.key === 'Escape') colorPop(false); });
$('#sizes').addEventListener('click', e => { const b = e.target.closest('.size'); if (b) { width = Number(b.dataset.w); erasing = false; pickTool(); } });
$('#eraser').addEventListener('click', () => { erasing = !erasing; colorPop(false); pickTool(); });
$('#undo').addEventListener('click', () => {
  // giáo viên xóa nét mới nhất của bất kỳ ai, học sinh chỉ xóa nét của mình
  const last = [...page(pageKey()).values()].reverse().find(s => isTeacher() || s.by === me.id);
  if (last) act('remove', { page: pageKey(), id: last.id });
});
$('#clear').addEventListener('click', () => confirm('Xóa hết nét vẽ trên trang này?') && act('clear', { page: pageKey() }));
pickTool();

/* ---------- Tin nhắn trong phòng ---------- */
// act: làm ngay ở máy mình rồi gửi cho mọi người (Ably không gửi lại tin cho chính người gửi)
function act(type, data) { onMessage(type, data, me.id); net.publish(type, data); }

// Người vào sau xin trạng thái; giáo viên trả lời, không có giáo viên thì người có mã nhỏ nhất trả lời
function isHostFor(newId) {
  const ids = [...people.keys()].filter(id => id !== newId).sort();
  return (ids.find(isTeacher) || ids[0]) === me.id;
}
function sendState(to) {
  net.publish('state', { to, lesson: state.lesson, slide: state.slide, drawers: [...drawers], chat: chatLog.slice(-40) });
  for (const [key, map] of pages) {
    let batch = [], size = 0, first = true;
    const send = () => { net.publish('page', { to, key, reset: first, strokes: batch }); first = false; batch = []; size = 0; };
    for (const s of map.values()) {
      const n = JSON.stringify(s).length;
      if (size + n > CHUNK && batch.length) send();
      batch.push(s); size += n;
    }
    if (batch.length) send();
  }
}

function onMessage(type, d, from) {
  if (!me || !d) return;
  const fromTeacher = isTeacher(from);
  const forMe = d.to === me.id;
  switch (type) {
    case 'signal': if (forMe) onSignal(from, d.data).catch(err => console.warn('signal', err)); break;
    case 'hello': if (from !== me.id && isHostFor(from)) sendState(from); break;
    case 'state':
      if (!forMe) break;
      state.lesson = d.lesson || null; state.slide = Number(d.slide) || 0;
      drawers = new Set(d.drawers || []);
      if (!chatLog.length) for (const m of d.chat || []) { chatLog.push(m); addMsg(m, true); }
      showPage(); renderPeople();
      break;
    case 'page':
      if (d.to && !forMe) break;
      if (d.reset) pages.set(d.key, new Map());
      for (const s of d.strokes || []) page(d.key).set(s.id, s);
      if (d.key === pageKey()) redraw();
      break;
    case 'goto':
      if (!fromTeacher) break;
      state.lesson = d.lesson || null; state.slide = Math.max(0, Number(d.slide) || 0);
      showPage();
      break;
    case 'perm':
      if (!fromTeacher) break;
      drawers = new Set(d.drawers || []);
      renderPeople();
      break;
    case 'mute':
      if (!fromTeacher || !forMe) break;
      if (track('audio')) track('audio').enabled = false;
      state.mic = false;
      refreshMe(true);
      toast('Giáo viên đã tắt mic của bạn');
      break;
    case 'lower-hand':
      if (!fromTeacher || !forMe) break;
      state.hand = false;
      refreshMe(true);
      renderPeople();
      break;
    case 's:start': {
      if (!canDraw(from)) break;
      const s = { id: String(d.id), by: from, page: d.page, color: String(d.color), width: Math.min(40, Number(d.width) || 3), points: d.points || [] };
      page(s.page).set(s.id, s);
      if (s.page === pageKey()) seg(s, 0);
      break;
    }
    case 's:pts': {
      const s = page(d.page).get(d.id);
      if (!s || s.by !== from) break;
      const at = s.points.length;
      s.points.push(...(d.points || []));
      if (s.page === pageKey()) seg(s, at);
      break;
    }
    case 'remove': {
      const s = page(d.page).get(d.id);
      if (s && (fromTeacher || s.by === from)) { page(d.page).delete(d.id); if (d.page === pageKey()) redraw(); }
      break;
    }
    case 'clear':
      if (!fromTeacher) break;
      pages.set(d.page, new Map());
      if (d.page === pageKey()) redraw();
      break;
    case 'chat': {
      const m = { name: String(d.name).slice(0, 30), role: roleOf(from), text: String(d.text).slice(0, 500), at: Number(d.at) || Date.now() };
      chatLog.push(m);
      if (chatLog.length > 100) chatLog.shift();
      addMsg(m, from === me.id);
      break;
    }
  }
}

function onPresence(action, p) {
  if (!me || p.id === me.id) return;
  if (action === 'leave' || action === 'absent') {
    const was = people.get(p.id);
    people.delete(p.id);
    drop(p.id);
    if (was) toast(`${was.name} đã rời lớp`);
  } else {
    const isNew = !people.has(p.id);
    people.set(p.id, { ...p, name: String(p.name || 'Ẩn danh'), role: roleOf(p.id) });
    if (isNew) meet(p.id);
    if (isNew && action === 'enter') toast(`${people.get(p.id).name} vừa vào lớp`);
  }
  renderPeople();
}

/* ---------- Vào phòng ---------- */
async function enter() {
  people = new Map([[me.id, me]]);
  $('#join').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#roomName').textContent = form.room.value;
  $('#flip').classList.toggle('hidden', FAKE || !/Android|iPhone|iPad/i.test(navigator.userAgent));
  lessons = await fetch('lessons.json').then(r => r.json()).catch(() => []);
  // lấy lại danh sách: có thể có người vào trong lúc mình chờ trình duyệt hỏi quyền camera
  const others = (await net.members()).filter(p => p.id !== me.id);
  for (const p of others) if (!people.has(p.id)) people.set(p.id, { ...p, name: String(p.name || 'Ẩn danh'), role: roleOf(p.id) });
  paintButtons();
  watchMic();
  fitStage();
  showPage();
  renderPeople();
  await net.enter(myPresence());
  net.publish('hello', {});
  net.onState(s => {
    $('.net').textContent = s === 'connected' ? (LOCAL ? 'chế độ thử một máy' : FAKE ? 'camera giả' : '')
      : { connecting: 'đang kết nối…', disconnected: '⚠️ Mất mạng — đang nối lại…', suspended: '⚠️ Mất mạng lâu — đang thử lại…', failed: '⚠️ Không kết nối được' }[s] || '';
  });
  $('.net').textContent = LOCAL ? 'chế độ thử một máy' : FAKE ? 'camera giả' : '';
  for (const p of others) meet(p.id);
}

$('#mic').addEventListener('click', () => toggle('audio'));
$('#cam').addEventListener('click', () => toggle('video'));
$('#flip').addEventListener('click', flip);
$('#hand').addEventListener('click', () => { state.hand = !state.hand; refreshMe(true); renderPeople(); });
$('#leave').addEventListener('click', () => {
  for (const id of [...peers.keys()]) drop(id);
  local.getTracks().forEach(t => t.stop());
  net?.close();
  location.reload();
});
$('#copy').addEventListener('click', async () => {
  const link = `${location.origin}${location.pathname}?room=${encodeURIComponent(form.room.value)}`;
  try { await navigator.clipboard.writeText(link); toast('Đã chép link: ' + link); }
  catch { prompt('Chép link này gửi học sinh:', link); }
});
</script>
<script>
// nút bật/tắt kính chỉ hiện khi /glass/glass.js đã nạp
if (window.glassMode) document.querySelectorAll('[data-glass-toggle]').forEach(b => b.classList.remove('hidden'));
</script>
