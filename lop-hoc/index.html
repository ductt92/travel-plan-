<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lớp học trực tiếp</title>
<style>
:root {
  --bg: #f4f2ee; --panel: #ffffff; --ink: #1f1d1a; --muted: #6b665e; --line: #e2ddd4;
  --accent: #b5452f; --accent-ink: #fff; --ok: #2f7d4f; --warn: #b7791f; --tile: #2a2724;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #171614; --panel: #22201d; --ink: #f1ede6; --muted: #a39d93; --line: #36322d; --tile: #0f0e0d; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 14px; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.off { background: #c0392b; color: #fff; border-color: #c0392b; }
button.on { background: var(--ok); color: #fff; border-color: var(--ok); }
button:disabled { opacity: .45; cursor: default; }
input, select { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 9px 11px; width: 100%; }
.hidden { display: none !important; }

/* Màn hình vào lớp */
#join { min-height: 100%; display: grid; place-items: center; padding: 16px; }
#join form { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: grid; gap: 12px; }
#join h1 { margin: 0 0 4px; font-size: 22px; }
#join label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
#join .roles { display: flex; gap: 8px; }
#join .roles label { flex: 1; display: flex; gap: 6px; align-items: center; color: var(--ink); font-size: 15px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
#join .roles input { width: auto; }
#join .err { color: #c0392b; font-size: 14px; min-height: 1em; }
#join .hint { color: var(--muted); font-size: 13px; margin: 0; }

/* Lớp học */
#app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
header .room { font-weight: 600; }
header .grow { flex: 1; }
header .net { font-size: 13px; color: var(--muted); }
main { min-height: 0; display: grid; grid-template-columns: 1fr 320px; gap: 12px; padding: 12px; }
.left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.view { flex: 1; min-height: 0; position: relative; display: grid; }
.view > * { grid-area: 1 / 1; min-height: 0; }
.stage-wrap { display: grid; place-items: center; }
/* Phóng to giáo viên: camera giáo viên chiếm chỗ chính, bảng thu nhỏ ở góc nhưng vẫn chạy và vẽ được */
.focus { display: none; position: relative; background: var(--tile); border-radius: 8px; overflow: hidden; }
.focus video { width: 100%; height: 100%; object-fit: contain; display: block; }
.focus.me video { transform: scaleX(-1); }
.focus .avatar { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 64px; font-weight: 600; }
.focus .label { position: absolute; left: 10px; bottom: 10px; color: #fff; font-size: 14px; background: rgba(0,0,0,.55); border-radius: 6px; padding: 2px 8px; }
.mini-btn { display: none; position: absolute; top: 6px; left: 6px; z-index: 3; padding: 3px 10px; font-size: 12px; background: rgba(0,0,0,.6); color: #fff; border: 0; }
.focus-on .focus { display: block; }
.focus-on .stage-wrap { position: absolute; right: 12px; bottom: 12px; width: min(32%, 360px); aspect-ratio: 16 / 9; z-index: 2;
  border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
.focus-on .mini-btn { display: block; }
.tile.teacher { cursor: zoom-in; }
/* đang phóng to thì ô giáo viên bên phải về cỡ thường, khỏi lặp hình lớn hai lần */
.focusing .tile.teacher { grid-column: auto; aspect-ratio: 4 / 3; cursor: zoom-out; }
.short { display: none; }
header .room, header button { white-space: nowrap; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 100%; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage canvas.drawing { cursor: crosshair; touch-action: none; }
.stage .blank { position: absolute; inset: 0; display: grid; place-items: center; color: #b9b2a6; font-size: 14px; pointer-events: none; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tools select { width: auto; padding: 6px 8px; }
.tools .page { color: var(--muted); font-size: 14px; min-width: 64px; text-align: center; }
.tools .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
.swatch { width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid transparent; }
.swatch.sel { border-color: var(--ink); }
.tools button.sel { border-color: var(--ink); font-weight: 600; }

.side { min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.videos { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tile { position: relative; aspect-ratio: 4 / 3; background: var(--tile); border-radius: 8px; overflow: hidden; }
.tile.teacher { grid-column: 1 / -1; aspect-ratio: 16 / 9; }
.tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile.me video { transform: scaleX(-1); }
.tile .avatar { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 26px; font-weight: 600; background: var(--tile); }
.tile .label { position: absolute; left: 6px; bottom: 6px; right: 6px; display: flex; gap: 4px; align-items: center; font-size: 12px; color: #fff; }
.tile .label span { background: rgba(0,0,0,.55); border-radius: 6px; padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .state { position: absolute; top: 6px; left: 6px; font-size: 11px; color: #fff; background: rgba(0,0,0,.55); border-radius: 6px; padding: 1px 6px; }

.panel { flex: 1; min-height: 220px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; border-radius: 0; background: none; padding: 9px; color: var(--muted); }
.tabs button.sel { color: var(--ink); box-shadow: inset 0 -2px var(--accent); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; }
.list { flex: 1; overflow: auto; padding: 8px 10px; }
.person { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.person .name { flex: 1; min-width: 100px; }
.person .role { font-size: 11px; color: var(--muted); }
.person button { padding: 3px 9px; font-size: 12px; }
.msg { margin: 0 0 8px; }
.msg b { font-size: 13px; }
.msg b.t { color: var(--accent); }
.msg time { color: var(--muted); font-size: 11px; margin-left: 4px; }
.msg div { white-space: pre-wrap; word-break: break-word; }
.chat-form { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }

footer { display: flex; justify-content: center; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
#toast { position: fixed; left: 50%; top: 60px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 10; max-width: calc(100% - 32px); }

@media (max-width: 820px) {
  #app { height: auto; min-height: 100%; }
  main { grid-template-columns: 1fr; padding: 8px; }
  .view { display: block; }
  .stage-wrap { display: block; }
  .focus-on .focus { aspect-ratio: 4 / 3; }
  .focus-on .stage-wrap { right: 8px; bottom: 8px; width: 46%; }
  .focusing .tile.teacher { grid-column: auto; }
  header { gap: 6px; padding: 8px; }
  header button { padding: 6px 10px; }
  .long { display: none; }
  .short { display: inline; }
  .videos { grid-template-columns: repeat(3, 1fr); }
  .tile.teacher { grid-column: span 3; }
  .panel { min-height: 300px; }
  footer { position: sticky; bottom: 0; }
  footer button { padding: 7px 11px; }
}
</style>
</head>
<body>

<section id="join">
  <form>
    <h1>Lớp học trực tiếp</h1>
    <p class="hint">Video, bảng vẽ trên slide, chat. Tối đa 6 người một phòng.</p>
    <label>Tên của bạn <input name="name" required maxlength="30" autocomplete="nickname"></label>
    <label>Mã phòng <input name="room" required maxlength="32" value="hsk" autocapitalize="none"></label>
    <div class="roles">
      <label><input type="radio" name="role" value="student" checked> Học sinh</label>
      <label><input type="radio" name="role" value="teacher"> Giáo viên</label>
    </div>
    <label class="pass hidden">Mật khẩu giáo viên <input name="pass" type="password" autocomplete="current-password"></label>
    <div class="err"></div>
    <button class="primary" type="submit">Vào lớp</button>
  </form>
</section>

<section id="app" class="hidden">
  <header>
    <span class="room"></span>
    <button id="copy" type="button"><span class="long">Sao chép link mời</span><span class="short">Link mời</span></button>
    <button id="focusBtn" type="button" class="hidden">⛶ Phóng to giáo viên</button>
    <span class="grow"></span>
    <span class="net"></span>
  </header>
  <main>
    <div class="left">
      <div class="view" id="view">
        <div class="focus" id="focus">
          <video autoplay playsinline muted></video>
          <div class="avatar hidden"></div>
          <div class="label"></div>
        </div>
        <div class="stage-wrap">
          <div class="stage" id="stage">
            <div class="blank">Bảng trắng</div>
            <img id="slide" alt="" class="hidden">
            <canvas id="board"></canvas>
            <button class="mini-btn" id="boardBig" type="button">⤢ Phóng to bảng</button>
          </div>
        </div>
      </div>
      <div class="tools">
        <span class="teacher-only tools">
          <select id="lesson"><option value="">Bảng trắng</option></select>
          <button id="prev" type="button" title="Slide trước (←)">‹</button>
          <span class="page" id="page"></span>
          <button id="next" type="button" title="Slide sau (→)">›</button>
          <span class="sep"></span>
        </span>
        <span class="draw-only tools">
          <span id="swatches" class="tools"></span>
          <button id="eraser" type="button">Tẩy</button>
          <select id="size" title="Độ dày nét">
            <option value="2">Mảnh</option><option value="4" selected>Vừa</option><option value="8">Dày</option>
          </select>
          <button id="undo" type="button">Hoàn tác</button>
          <button id="clear" type="button" class="teacher-only">Xóa trang</button>
        </span>
        <span class="page student-only" id="spage"></span>
      </div>
    </div>
    <aside class="side">
      <div class="videos" id="videos"></div>
      <div class="panel">
        <div class="tabs">
          <button type="button" data-tab="people" class="sel">Người học (<span id="count">1</span>)</button>
          <button type="button" data-tab="chat">Chat <span class="badge hidden" id="unread"></span></button>
        </div>
        <div class="list" id="people"></div>
        <div class="list hidden" id="chat"></div>
        <form class="chat-form hidden" id="chatForm">
          <input name="text" maxlength="500" placeholder="Nhắn cho cả lớp…" autocomplete="off">
          <button type="submit">Gửi</button>
        </form>
      </div>
    </aside>
  </main>
  <footer>
    <button id="mic" type="button">🎤 Mic</button>
    <button id="cam" type="button">📷 Camera</button>
    <button id="flip" type="button" class="hidden">🔄 Đổi camera</button>
    <button id="hand" type="button" class="student-only">✋ Giơ tay</button>
    <button id="leave" type="button" class="off">Rời lớp</button>
  </footer>
</section>

<div id="toast" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/ably@2.28.0/build/ably.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const FAKE = params.has('fake');   // ?fake=1: camera giả để thử nhiều tab trên một máy
const LOCAL = params.has('local'); // ?local=1: các tab nói chuyện với nhau qua BroadcastChannel, không cần Ably
const API = `/api/${params.get('api') === 'go' ? 'go' : 'node'}/lop-hoc`;
const ICE = [{ urls: 'stun:stun.l.google.com:19302' }];
const COLORS = ['#1f1d1a', '#c0392b', '#1e6fd9', '#2f7d4f', '#d68910'];
const MAX_PEOPLE = 6;
const CHUNK = 30000; // gửi nét vẽ cho người mới theo từng gói ~30 KB (Ably giới hạn cỡ một tin nhắn)

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

let net, me, people = new Map(), lessons = [];
let local = new MediaStream(), facing = 'user';
const peers = new Map(); // id → { pc, stream, queue: [] }
const state = { lesson: null, slide: 0, mic: true, cam: true, hand: false };
const pages = new Map(); // "bai21:3" → Map(id → nét vẽ): giữ nét của mọi trang để người vào sau nhận lại
let drawers = new Set(); // học sinh được giáo viên giao bút
const chatLog = [];

function toast(text, ms = 2500) {
  const t = $('#toast');
  t.textContent = text;
  t.classList.remove('hidden');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.add('hidden'), ms);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const roleOf = id => id.startsWith('gv-') ? 'teacher' : 'student';
const isTeacher = (id = me?.id) => !!id && roleOf(id) === 'teacher';
const canDraw = (id = me?.id) => isTeacher(id) || drawers.has(id);
const randomId = () => [...crypto.getRandomValues(new Uint8Array(12))].map(b => (b % 36).toString(36)).join('');

/* ---------- Kênh liên lạc ---------- */
// Mỗi phòng một kênh Ably "lop:<phòng>". Token do /api/<node|go>/lop-hoc ký, gắn clientId vào mọi tin nhắn:
// "gv-…" chắc chắn là giáo viên, nên lệnh đổi slide, tắt mic, giao bút chỉ nhận khi đến từ "gv-…".
async function connectAbly(room, clientId, pass) {
  const getToken = async () => {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ room, clientId, pass }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `Máy chủ lỗi (${r.status})`);
    return j;
  };
  let first = await getToken(); // xin trước để báo lỗi (sai mật khẩu…) ngay ở màn hình vào lớp
  const client = new Ably.Realtime({
    clientId, echoMessages: false,
    authCallback: (_, cb) => {
      if (first) { const t = first; first = null; return cb(null, t); }
      getToken().then(t => cb(null, t), err => cb(err.message, null)); // token hết hạn thì xin lại
    }
  });
  await new Promise((ok, bad) => {
    const fail = msg => { client.close(); bad(new Error(msg)); };
    const timer = setTimeout(() => fail('Không kết nối được, kiểm tra lại mạng'), 15000);
    client.connection.once('connected', () => { clearTimeout(timer); ok(); });
    client.connection.once('failed', s => { clearTimeout(timer); fail(s.reason?.message || 'Không kết nối được Ably'); });
  });
  const ch = client.channels.get('lop:' + room);
  return {
    publish: (type, data) => ch.publish(type, data).catch(err => console.warn('gửi lỗi', type, err)),
    listen: cb => ch.subscribe(m => cb(m.name, m.data, m.clientId)),
    watch: cb => ch.presence.subscribe(m => cb(m.action, { id: m.clientId, ...m.data })),
    members: async () => (await ch.presence.get()).map(m => ({ id: m.clientId, ...m.data })),
    enter: data => ch.presence.enter(data),
    update: data => ch.presence.update(data),
    onState: cb => client.connection.on(s => cb(s.current)),
    close: () => client.close()
  };
}

// Bản thử không cần Ably: các tab cùng trình duyệt nói chuyện qua BroadcastChannel, có nhịp tim thay cho presence
function connectLocal(room, clientId) {
  const bc = new BroadcastChannel('lop-hoc:' + room);
  const seen = new Map(); // id → { data, at }
  let mine = null, onMsg = () => {}, onPres = () => {};
  const post = (kind, body = {}) => bc.postMessage({ kind, from: clientId, ...body });
  bc.onmessage = ({ data: m }) => {
    if (m.kind === 'msg') return onMsg(m.type, m.data, m.from);
    if (m.kind === 'who') return mine && post('here', { data: mine });
    if (m.kind === 'leave') { if (seen.delete(m.from)) onPres('leave', { id: m.from, ...m.data }); return; }
    const isNew = !seen.has(m.from);
    seen.set(m.from, { data: m.data, at: Date.now() });
    if (isNew) onPres('enter', { id: m.from, ...m.data });
    else if (m.kind === 'update') onPres('update', { id: m.from, ...m.data });
  };
  const beat = setInterval(() => {
    if (mine) post('here', { data: mine });
    for (const [id, v] of seen) if (Date.now() - v.at > 6000) { seen.delete(id); onPres('leave', { id, ...v.data }); }
  }, 2000);
  const leave = () => mine && post('leave', { data: mine });
  addEventListener('pagehide', leave);
  return {
    publish: (type, data) => post('msg', { type, data }),
    listen: cb => { onMsg = cb; },
    watch: cb => { onPres = cb; },
    members: () => new Promise(ok => { post('who'); setTimeout(() => ok([...seen].map(([id, v]) => ({ id, ...v.data }))), 500); }),
    enter: data => { mine = data; post('here', { data }); },
    update: data => { mine = data; post('update', { data }); },
    onState: () => {},
    close: () => { leave(); clearInterval(beat); bc.close(); }
  };
}

/* ---------- Vào lớp ---------- */
const form = $('#join form');
form.name.value = store.get('lop-name') || '';
if (params.get('room')) form.room.value = params.get('room');
form.addEventListener('change', () => $('.pass').classList.toggle('hidden', form.role.value !== 'teacher'));
form.addEventListener('submit', async e => {
  e.preventDefault();
  const btn = form.querySelector('button');
  const err = $('#join .err');
  const room = form.room.value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 32);
  const name = form.name.value.trim().slice(0, 30);
  if (!room || !name) { err.textContent = 'Cần nhập tên và mã phòng (chữ không dấu, số)'; return; }
  btn.disabled = true;
  err.textContent = 'Đang kết nối…';
  store.set('lop-name', name);
  const clientId = (form.role.value === 'teacher' ? 'gv-' : 'hs-') + randomId();
  try {
    net = LOCAL ? connectLocal(room, clientId) : await connectAbly(room, clientId, form.pass.value);
    await net.listen(onMessage);
    await net.watch(onPresence);
    const others = (await net.members()).filter(p => p.id !== clientId);
    if (others.length >= MAX_PEOPLE) throw new Error(`Phòng đã đủ ${MAX_PEOPLE} người`);
    await startMedia(name);
    me = { id: clientId, name, role: roleOf(clientId) };
    form.room.value = room;
    err.textContent = '';
    await enter();
  } catch (ex) {
    err.textContent = ex.message || String(ex);
    net?.close();
    net = null;
  } finally { btn.disabled = false; }
});

/* ---------- Camera / mic ---------- */
function fakeStream(label) {
  const c = Object.assign(document.createElement('canvas'), { width: 480, height: 360 });
  const g = c.getContext('2d');
  const hue = Math.floor(Math.random() * 360);
  (function frame() {
    g.fillStyle = `hsl(${hue} 45% 35%)`; g.fillRect(0, 0, 480, 360);
    g.fillStyle = '#fff'; g.font = '32px system-ui'; g.textAlign = 'center';
    g.fillText(label, 240, 170); g.font = '20px system-ui';
    g.fillText(new Date().toLocaleTimeString('vi-VN'), 240, 210);
    setTimeout(frame, 200);
  })();
  const ac = new AudioContext();
  const dest = ac.createMediaStreamDestination();
  const osc = ac.createOscillator(), gain = ac.createGain();
  gain.gain.value = 0; osc.connect(gain).connect(dest); osc.start();
  return new MediaStream([...c.captureStream(10).getVideoTracks(), ...dest.stream.getAudioTracks()]);
}

async function startMedia(name) {
  if (FAKE) { local = fakeStream(name); return; }
  try {
    local = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
      video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { max: 20 }, facingMode: facing }
    });
  } catch {
    // không có camera hoặc bị từ chối: thử chỉ mic, rồi tới không có gì (vẫn xem và nghe được)
    try { local = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { local = new MediaStream(); }
    toast('Không mở được camera' + (local.getAudioTracks().length ? '' : ' và mic') + ' — vẫn vào lớp để xem và nghe được', 4000);
  }
  state.cam = !!local.getVideoTracks().length;
  state.mic = !!local.getAudioTracks().length;
}
const track = kind => (kind === 'audio' ? local.getAudioTracks() : local.getVideoTracks())[0] || null;

// Gắn track mới (bật camera lần đầu, đổi camera trước/sau) cho mọi kết nối mà không cần thương lượng lại
function replaceEverywhere(kind, t) {
  for (const { pc } of peers.values())
    for (const tr of pc.getTransceivers())
      if (tr.receiver.track.kind === kind) tr.sender.replaceTrack(t);
}

async function toggle(kind) {
  let t = track(kind);
  const key = kind === 'audio' ? 'mic' : 'cam';
  if (!t && !FAKE) {
    try {
      const s = await navigator.mediaDevices.getUserMedia(kind === 'audio' ? { audio: true } : { video: { facingMode: facing, width: { ideal: 640 } } });
      t = s.getTracks()[0];
      local.addTrack(t);
      replaceEverywhere(kind, t);
      state[key] = true;
      return refreshMe(true);
    } catch { return toast(kind === 'audio' ? 'Không mở được mic' : 'Không mở được camera'); }
  }
  if (!t) return;
  t.enabled = !t.enabled;
  state[key] = t.enabled;
  refreshMe(true);
}

async function flip() {
  facing = facing === 'user' ? 'environment' : 'user';
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 640 } } });
    const old = track('video');
    const t = s.getVideoTracks()[0];
    if (old) { local.removeTrack(old); old.stop(); }
    local.addTrack(t);
    replaceEverywhere('video', t);
    state.cam = true;
    refreshMe(true);
  } catch { toast('Không đổi được camera'); }
}

function paintButtons() {
  $('#mic').classList.toggle('off', !state.mic);
  $('#mic').textContent = state.mic ? '🎤 Mic' : '🔇 Mic tắt';
  $('#cam').classList.toggle('off', !state.cam);
  $('#cam').textContent = state.cam ? '📷 Camera' : '🚫 Camera tắt';
  $('#hand').classList.toggle('on', state.hand);
  $('#hand').textContent = state.hand ? '✋ Đang giơ tay' : '✋ Giơ tay';
}
// Trạng thái mic/cam/giơ tay của mình nằm trong presence: chỉ mình sửa, người khác đọc
const myPresence = () => ({ name: me.name, mic: state.mic, cam: state.cam, hand: state.hand });
function refreshMe(changed) {
  paintButtons();
  if (changed) net?.update(myPresence());
  renderTile(me.id);
}

/* ---------- WebRTC: mỗi người nối thẳng với từng người khác ---------- */
const signal = (to, data) => net.publish('signal', { to, data });
function peer(id) {
  if (peers.has(id)) return peers.get(id);
  const pc = new RTCPeerConnection({ iceServers: ICE });
  const p = { pc, stream: new MediaStream(), queue: [] };
  peers.set(id, p);
  pc.onicecandidate = e => e.candidate && signal(id, { candidate: e.candidate.toJSON() });
  pc.ontrack = e => { p.stream.addTrack(e.track); renderTile(id); };
  pc.onconnectionstatechange = () => {
    renderTile(id);
    if (pc.connectionState === 'failed') pc.restartIce?.();
  };
  return p;
}

// Hai người biết nhau (qua presence) thì người có mã nhỏ hơn gọi, nên không bao giờ hai bên gọi cùng lúc
async function call(id) {
  if (peers.has(id)) return;
  const { pc } = peer(id);
  for (const kind of ['audio', 'video']) {
    const tr = pc.addTransceiver(kind, { direction: 'sendrecv' });
    await tr.sender.replaceTrack(track(kind));
  }
  await pc.setLocalDescription(await pc.createOffer());
  signal(id, { sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } });
}
const meet = id => { if (me.id < id) call(id).catch(err => console.warn('gọi lỗi', err)); };

async function onSignal(from, data) {
  const p = peer(from), pc = p.pc;
  if (data.sdp) {
    await pc.setRemoteDescription(data.sdp);
    if (data.sdp.type === 'offer') {
      for (const tr of pc.getTransceivers()) {
        tr.direction = 'sendrecv';
        await tr.sender.replaceTrack(track(tr.receiver.track.kind));
      }
      await pc.setLocalDescription(await pc.createAnswer());
      signal(from, { sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } });
    }
    for (const c of p.queue.splice(0)) await pc.addIceCandidate(c).catch(() => {});
  } else if (data.candidate) {
    if (pc.remoteDescription) await pc.addIceCandidate(data.candidate).catch(() => {});
    else p.queue.push(data.candidate);
  }
}

function drop(id) {
  peers.get(id)?.pc.close();
  peers.delete(id);
  document.getElementById('tile-' + id)?.remove();
}

/* ---------- Ô video ---------- */
function renderTile(id) {
  const person = people.get(id);
  if (!person) return;
  let el = document.getElementById('tile-' + id);
  if (!el) {
    el = document.createElement('div');
    el.id = 'tile-' + id;
    el.className = 'tile';
    el.innerHTML = '<video autoplay playsinline></video><div class="avatar"></div><div class="state hidden"></div><div class="label"></div>';
    const v = el.querySelector('video');
    if (id === me.id) { el.classList.add('me'); v.muted = true; v.srcObject = local; }
    else v.srcObject = peers.get(id)?.stream || null;
    $('#videos').append(el);
  }
  const v = el.querySelector('video');
  if (id !== me.id && peers.get(id) && v.srcObject !== peers.get(id).stream) v.srcObject = peers.get(id).stream;
  if (id === me.id && v.srcObject !== local) v.srcObject = local;
  v.play?.().catch(() => {});
  el.classList.toggle('teacher', person.role === 'teacher');
  const camOn = id === me.id ? state.cam && !!track('video') : person.cam !== false;
  el.querySelector('.avatar').classList.toggle('hidden', camOn);
  el.querySelector('.avatar').textContent = person.name.trim().split(/\s+/).pop().slice(0, 1).toUpperCase();
  const micOn = id === me.id ? state.mic : person.mic !== false;
  const hand = id === me.id ? state.hand : person.hand;
  el.querySelector('.label').innerHTML =
    `<span>${esc(person.name)}${id === me.id ? ' (bạn)' : ''}${person.role === 'teacher' ? ' · GV' : ''}</span>` +
    (micOn ? '' : '<span>🔇</span>') + (hand ? '<span>✋</span>' : '');
  const st = el.querySelector('.state');
  const cs = peers.get(id)?.pc.connectionState;
  st.classList.toggle('hidden', id === me.id || cs === 'connected');
  st.textContent = { new: 'đang nối…', connecting: 'đang nối…', disconnected: 'chập chờn…', failed: 'không nối được', closed: 'đã đóng' }[cs] || 'đang nối…';
  // giáo viên lên đầu
  if (person.role === 'teacher' && $('#videos').firstChild !== el) $('#videos').prepend(el);
  if (person.role === 'teacher') renderFocus();
}

/* ---------- Danh sách người học ---------- */

function applyRole() {

/* ---------- Chat ---------- */
let tab = 'people', unread = 0;
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  tab = b.dataset.tab;

  $('#chatForm').classList.toggle('hidden', tab !== 'chat');

}));
function addMsg(m, quiet) {
  const box = $('#chat');
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.insertAdjacentHTML('beforeend', `<p class="msg"><b class="${m.role === 'teacher' ? 't' : ''}">${esc(m.name)}</b>` +

}
$('#chatForm').addEventListener('submit', e => {
  e.preventDefault();

/* ---------- Slide + bảng vẽ ---------- */
const stage = $('#stage'), board = $('#board'), ctx = board.getContext('2d');
let color = COLORS[1], erasing = false;
const pageKey = () => `${state.lesson || 'trang'}:${state.slide}`;
const page = key => { if (!pages.has(key)) pages.set(key, new Map()); return pages.get(key); };

function fitStage() {
  // giữ khung 16:9 vừa cả bề rộng lẫn bề cao chỗ trống
  const wrap = stage.parentElement;
  if (innerWidth > 820) {
    const w = Math.min(wrap.clientWidth, wrap.clientHeight * 16 / 9);
    stage.style.width = w + 'px';
  } else stage.style.width = '100%';
  const dpr = devicePixelRatio || 1;
  board.width = Math.round(stage.clientWidth * dpr);
  board.height = Math.round(stage.clientHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
new ResizeObserver(fitStage).observe(stage.parentElement);

function seg(s, from) {
  const W = stage.clientWidth, H = stage.clientHeight, pts = s.points;
  if (!pts.length) return;
  ctx.save();
  ctx.globalCompositeOperation = s.color === 'erase' ? 'destination-out' : 'source-over';
  ctx.strokeStyle = ctx.fillStyle = s.color === 'erase' ? '#000' : s.color;
  ctx.lineWidth = s.width * W / 1000;
  ctx.lineCap = ctx.lineJoin = 'round';
  if (pts.length === 1) {
    ctx.beginPath(); ctx.arc(pts[0][0] * W, pts[0][1] * H, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath();
    const a = Math.max(0, from - 1);
    ctx.moveTo(pts[a][0] * W, pts[a][1] * H);
    for (let i = a + 1; i < pts.length; i++) ctx.lineTo(pts[i][0] * W, pts[i][1] * H);
    ctx.stroke();
  }
  ctx.restore();
}
function redraw() {
  ctx.clearRect(0, 0, stage.clientWidth, stage.clientHeight);
  for (const s of page(pageKey()).values()) seg(s, 0);
}

function showPage() {
  const { lesson, slide } = state;
  const L = lessons.find(l => l.id === lesson);
  const img = $('#slide');
  img.classList.toggle('hidden', !L);
  stage.querySelector('.blank').classList.toggle('hidden', !!L);
  if (L) img.src = L.slides[Math.min(slide, L.slides.length - 1)];
  const label = L ? `${slide + 1} / ${L.slides.length}` : 'Bảng trắng';
  $('#page').textContent = label;
  $('#spage').textContent = L ? `${L.id.replace('bai', 'Bài ')} · slide ${label}` : 'Bảng trắng';
  $('#lesson').value = lesson || '';
  $('#prev').disabled = !L || slide <= 0;
  $('#next').disabled = !L || slide >= L.slides.length - 1;
  redraw();
}
const go = (lesson, slide) => act('goto', { lesson, slide });
$('#lesson').addEventListener('change', e => go(e.target.value || null, 0));
$('#prev').addEventListener('click', () => go(state.lesson, state.slide - 1));
$('#next').addEventListener('click', () => go(state.lesson, state.slide + 1));
addEventListener('keydown', e => {
  if (!me || !isTeacher() || e.target.closest('input, select, textarea')) return;
  if (e.key === 'ArrowLeft' && !$('#prev').disabled) go(state.lesson, state.slide - 1);
  if (e.key === 'ArrowRight' && !$('#next').disabled) go(state.lesson, state.slide + 1);
});

// Vẽ: gửi điểm theo lô 10 lần/giây — đủ để người xem thấy nét chạy mà tốn ít tin nhắn
let drawing = null, pending = [], seq = 0, flushTimer = null;
const pos = e => {
  const r = stage.getBoundingClientRect();
  return [+((e.clientX - r.left) / r.width).toFixed(4), +((e.clientY - r.top) / r.height).toFixed(4)];
};
function flush() {
  clearTimeout(flushTimer);
  flushTimer = null;
  if (drawing && pending.length) net.publish('s:pts', { page: drawing.page, id: drawing.id, points: pending.splice(0) });
}
function startStroke(p) {
  drawing = { id: `${me.id}-${++seq}`, by: me.id, page: pageKey(), color: erasing ? 'erase' : color,
    width: erasing ? 30 : Number($('#size').value), points: [p] };
  page(drawing.page).set(drawing.id, drawing);
  seg(drawing, 0);
  net.publish('s:start', { id: drawing.id, page: drawing.page, color: drawing.color, width: drawing.width, points: [p] });
}
board.addEventListener('pointerdown', e => {
  if (!canDraw() || (e.pointerType === 'mouse' && e.button !== 0)) return;
  try { board.setPointerCapture(e.pointerId); } catch {}
  startStroke(pos(e));
});
board.addEventListener('pointermove', e => {
  if (!drawing) return;
  const co = e.getCoalescedEvents?.() || [];
  const from = drawing.points.length;
  for (const ev of co.length ? co : [e]) { const p = pos(ev); drawing.points.push(p); pending.push(p); }
  seg(drawing, from);
  // nét quá dài thì cắt thành nét mới để mỗi nét vừa một tin nhắn khi gửi cho người vào sau
  if (drawing.points.length > 1000) { const last = drawing.points.at(-1); flush(); startStroke(last); }
  flushTimer ||= setTimeout(flush, 100);
});
const endStroke = () => { if (!drawing) return; flush(); drawing = null; };
board.addEventListener('pointerup', endStroke);
board.addEventListener('pointercancel', endStroke);

$('#swatches').innerHTML = COLORS.map(c => `<button type="button" class="swatch" data-c="${c}" style="background:${c}" title="Bút màu"></button>`).join('');
function pickTool() {
  document.querySelectorAll('.swatch').forEach(b => b.classList.toggle('sel', !erasing && b.dataset.c === color));
  $('#eraser').classList.toggle('sel', erasing);
}
$('#swatches').addEventListener('click', e => { const b = e.target.closest('.swatch'); if (b) { color = b.dataset.c; erasing = false; pickTool(); } });
$('#eraser').addEventListener('click', () => { erasing = !erasing; pickTool(); });
$('#undo').addEventListener('click', () => {
  // giáo viên xóa nét mới nhất của bất kỳ ai, học sinh chỉ xóa nét của mình
  const last = [...page(pageKey()).values()].reverse().find(s => isTeacher() || s.by === me.id);
  if (last) act('remove', { page: pageKey(), id: last.id });
});
$('#clear').addEventListener('click', () => confirm('Xóa hết nét vẽ trên trang này?') && act('clear', { page: pageKey() }));
pickTool();

/* ---------- Tin nhắn trong phòng ---------- */
// act: làm ngay ở máy mình rồi gửi cho mọi người (Ably không gửi lại tin cho chính người gửi)
function act(type, data) { onMessage(type, data, me.id); net.publish(type, data); }

// Người vào sau xin trạng thái; giáo viên trả lời, không có giáo viên thì người có mã nhỏ nhất trả lời
function isHostFor(newId) {
  const ids = [...people.keys()].filter(id => id !== newId).sort();
  return (ids.find(isTeacher) || ids[0]) === me.id;
}
function sendState(to) {
  net.publish('state', { to, lesson: state.lesson, slide: state.slide, drawers: [...drawers], chat: chatLog.slice(-40) });
  for (const [key, map] of pages) {
    let batch = [], size = 0, first = true;
    const send = () => { net.publish('page', { to, key, reset: first, strokes: batch }); first = false; batch = []; size = 0; };
    for (const s of map.values()) {
      const n = JSON.stringify(s).length;
      if (size + n > CHUNK && batch.length) send();
      batch.push(s); size += n;
    }
    if (batch.length) send();
  }
}

function onMessage(type, d, from) {
  if (!me || !d) return;
  const fromTeacher = isTeacher(from);
  const forMe = d.to === me.id;
  switch (type) {
    case 'signal': if (forMe) onSignal(from, d.data).catch(err => console.warn('signal', err)); break;
    case 'hello': if (from !== me.id && isHostFor(from)) sendState(from); break;
    case 'state':
      if (!forMe) break;
      state.lesson = d.lesson || null; state.slide = Number(d.slide) || 0;
      drawers = new Set(d.drawers || []);
      if (!chatLog.length) for (const m of d.chat || []) { chatLog.push(m); addMsg(m, true); }
      showPage(); renderPeople();
      break;
    case 'page':
      if (d.to && !forMe) break;
      if (d.reset) pages.set(d.key, new Map());
      for (const s of d.strokes || []) page(d.key).set(s.id, s);
      if (d.key === pageKey()) redraw();
      break;
    case 'goto':
      if (!fromTeacher) break;
      state.lesson = d.lesson || null; state.slide = Math.max(0, Number(d.slide) || 0);
      showPage();
      break;
    case 'perm':
      if (!fromTeacher) break;
      drawers = new Set(d.drawers || []);
      renderPeople();
      break;
    case 'mute':
      if (!fromTeacher || !forMe) break;
      if (track('audio')) track('audio').enabled = false;
      state.mic = false;
      refreshMe(true);
      toast('Giáo viên đã tắt mic của bạn');
      break;
    case 'lower-hand':
      if (!fromTeacher || !forMe) break;
      state.hand = false;
      refreshMe(true);
      renderPeople();
      break;
    case 's:start': {
      if (!canDraw(from)) break;
      const s = { id: String(d.id), by: from, page: d.page, color: String(d.color), width: Math.min(40, Number(d.width) || 3), points: d.points || [] };
      page(s.page).set(s.id, s);
      if (s.page === pageKey()) seg(s, 0);
      break;
    }
    case 's:pts': {
      const s = page(d.page).get(d.id);
      if (!s || s.by !== from) break;
      const at = s.points.length;
      s.points.push(...(d.points || []));
      if (s.page === pageKey()) seg(s, at);
      break;
    }
    case 'remove': {
      const s = page(d.page).get(d.id);
      if (s && (fromTeacher || s.by === from)) { page(d.page).delete(d.id); if (d.page === pageKey()) redraw(); }
      break;
    }
    case 'clear':
      if (!fromTeacher) break;
      pages.set(d.page, new Map());
      if (d.page === pageKey()) redraw();
      break;
    case 'chat': {
      const m = { name: String(d.name).slice(0, 30), role: roleOf(from), text: String(d.text).slice(0, 500), at: Number(d.at) || Date.now() };
      chatLog.push(m);
      if (chatLog.length > 100) chatLog.shift();
      addMsg(m, from === me.id);
      break;
    }
  }
}

function onPresence(action, p) {
  if (!me || p.id === me.id) return;
  if (action === 'leave' || action === 'absent') {
    const was = people.get(p.id);
    people.delete(p.id);
    drop(p.id);
    if (was) toast(`${was.name} đã rời lớp`);
  } else {
    const isNew = !people.has(p.id);
    people.set(p.id, { ...p, name: String(p.name || 'Ẩn danh'), role: roleOf(p.id) });
    if (isNew) meet(p.id);
    if (isNew && action === 'enter') toast(`${people.get(p.id).name} vừa vào lớp`);
  }
  renderPeople();
}

/* ---------- Vào phòng ---------- */
async function enter() {
  people = new Map([[me.id, me]]);
  $('#join').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('.room').textContent = 'Phòng ' + form.room.value;
  $('#flip').classList.toggle('hidden', FAKE || !/Android|iPhone|iPad/i.test(navigator.userAgent));
  lessons = await fetch('lessons.json').then(r => r.json()).catch(() => []);
  $('#lesson').insertAdjacentHTML('beforeend', lessons.map(l => `<option value="${l.id}">${l.id.replace('bai', 'Bài ')}</option>`).join(''));
  // lấy lại danh sách: có thể có người vào trong lúc mình chờ trình duyệt hỏi quyền camera
  const others = (await net.members()).filter(p => p.id !== me.id);
  for (const p of others) if (!people.has(p.id)) people.set(p.id, { ...p, name: String(p.name || 'Ẩn danh'), role: roleOf(p.id) });
  paintButtons();
  fitStage();
  showPage();
  renderPeople();
  await net.enter(myPresence());
  net.publish('hello', {});
  net.onState(s => {
    $('.net').textContent = s === 'connected' ? (LOCAL ? 'chế độ thử một máy' : FAKE ? 'camera giả' : '')
      : { connecting: 'đang kết nối…', disconnected: '⚠️ Mất mạng — đang nối lại…', suspended: '⚠️ Mất mạng lâu — đang thử lại…', failed: '⚠️ Không kết nối được' }[s] || '';
  });
  $('.net').textContent = LOCAL ? 'chế độ thử một máy' : FAKE ? 'camera giả' : '';
  for (const p of others) meet(p.id);
}

$('#mic').addEventListener('click', () => toggle('audio'));
$('#cam').addEventListener('click', () => toggle('video'));
$('#flip').addEventListener('click', flip);
$('#hand').addEventListener('click', () => { state.hand = !state.hand; refreshMe(true); renderPeople(); });
$('#leave').addEventListener('click', () => {
  for (const id of [...peers.keys()]) drop(id);
  local.getTracks().forEach(t => t.stop());
  net?.close();
  location.reload();
});
$('#copy').addEventListener('click', async () => {
  const link = `${location.origin}${location.pathname}?room=${encodeURIComponent(form.room.value)}`;
  try { await navigator.clipboard.writeText(link); toast('Đã chép link: ' + link); }
  catch { prompt('Chép link này gửi học sinh:', link); }
});
</script>
