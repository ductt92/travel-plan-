<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body { margin: 0; }</style>
<link rel="stylesheet" href="/glass/react-liquis-glass.css">
<link rel="stylesheet" href="/glass/glass.css">
<script src="/glass/glass.js"></script>
<script>if (window.glassMode) document.documentElement.classList.add("glass-ok");</script>
<title>Ngữ pháp qua tình huống</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Bố cục: mục lục tình huống bên trái (dính khi cuộn), một tình huống mỗi lần ở giữa. Bảng màu tím mận giống trang "Ngọc học tiếng Trung". */
:root {
  --bg: #fbf8f3; --surface: #ffffff; --sunken: #f3eef2; --fg: #2a2230; --muted: #6c6274; --line: #e4dbe6;
  --accent: #5b2a6e; --accent-soft: #efe4f3; --on-accent: #ffffff;
  --mark: #de7028; --mark-soft: #fcebdc;
  --good: #2e7d4f; --good-soft: #e1f2e7; --bad: #b3372f; --bad-soft: #f8e1df;
  --f-body: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-hz: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18141c; --surface: #221c27; --sunken: #1d1822; --fg: #eee7f1; --muted: #a99db1; --line: #3a3141;
    --accent: #c99be0; --accent-soft: #34263d; --on-accent: #1b1320; --mark: #f2984f; --mark-soft: #3b2a1f;
    --good: #6fcf97; --good-soft: #1f3328; --bad: #f08a80; --bad-soft: #3d2422; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18141c; --surface: #221c27; --sunken: #1d1822; --fg: #eee7f1; --muted: #a99db1; --line: #3a3141;
  --accent: #c99be0; --accent-soft: #34263d; --on-accent: #1b1320; --mark: #f2984f; --mark-soft: #3b2a1f;
  --good: #6fcf97; --good-soft: #1f3328; --bad: #f08a80; --bad-soft: #3d2422; color-scheme: dark;
}
/* Giao diện chọn ở trang chủ web Ngọc (data-skin trên <html>), giống web/template.html */
:root[data-skin="hong"] { --bg: #fff6f9; --surface: #ffffff; --sunken: #fdeef4; --fg: #3b2a33; --muted: #86707c; --line: #f3d8e3; --accent: #c25683; --accent-soft: #fde3ee; --on-accent: #ffffff; --mark: #d9705a; --mark-soft: #fdebe4; }
:root[data-skin="bacha"] { --bg: #f4faf8; --surface: #ffffff; --sunken: #eaf5f1; --fg: #22312d; --muted: #61736d; --line: #d6e8e1; --accent: #2c7f6c; --accent-soft: #dcf1ea; --on-accent: #ffffff; --mark: #c9733d; --mark-soft: #f8eadf; }
:root[data-skin="troi"] { --bg: #f5f8fc; --surface: #ffffff; --sunken: #ebf1f9; --fg: #212b38; --muted: #5f6b7a; --line: #d8e2ef; --accent: #33639f; --accent-soft: #e1ebf8; --on-accent: #ffffff; --mark: #d0703a; --mark-soft: #fbe9dd; }
@media (prefers-color-scheme: dark) {
  :root[data-skin="hong"]:not([data-theme="light"]) { --bg: #1d1519; --surface: #281c22; --sunken: #22181d; --fg: #f6eaf0; --muted: #b69ba8; --line: #402c36; --accent: #f3a6c4; --accent-soft: #46293a; --on-accent: #2a1520; --mark: #f5b39d; --mark-soft: #44302a; }
  :root[data-skin="bacha"]:not([data-theme="light"]) { --bg: #131a18; --surface: #1b2421; --sunken: #17201d; --fg: #e4efeb; --muted: #95a8a1; --line: #2c3a35; --accent: #7fd0bb; --accent-soft: #1f3a33; --on-accent: #0f221d; --mark: #e8a774; --mark-soft: #3a2c20; }
  :root[data-skin="troi"]:not([data-theme="light"]) { --bg: #131820; --surface: #1b222c; --sunken: #171d26; --fg: #e5ebf3; --muted: #97a3b3; --line: #2c3644; --accent: #8db6ea; --accent-soft: #1f2f45; --on-accent: #0f1a2a; --mark: #eba277; --mark-soft: #3b2b20; }
}
:root[data-skin="hong"][data-theme="dark"] { --bg: #1d1519; --surface: #281c22; --sunken: #22181d; --fg: #f6eaf0; --muted: #b69ba8; --line: #402c36; --accent: #f3a6c4; --accent-soft: #46293a; --on-accent: #2a1520; --mark: #f5b39d; --mark-soft: #44302a; }
:root[data-skin="bacha"][data-theme="dark"] { --bg: #131a18; --surface: #1b2421; --sunken: #17201d; --fg: #e4efeb; --muted: #95a8a1; --line: #2c3a35; --accent: #7fd0bb; --accent-soft: #1f3a33; --on-accent: #0f221d; --mark: #e8a774; --mark-soft: #3a2c20; }
:root[data-skin="troi"][data-theme="dark"] { --bg: #131820; --surface: #1b222c; --sunken: #171d26; --fg: #e5ebf3; --muted: #97a3b3; --line: #2c3644; --accent: #8db6ea; --accent-soft: #1f2f45; --on-accent: #0f1a2a; --mark: #eba277; --mark-soft: #3b2b20; }
* { box-sizing: border-box; }
.back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600; }
.back:hover { color: var(--accent); }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.65; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hz { font-family: var(--f-hz); }

.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { padding-block: 28px 18px; border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; font-size: clamp(26px, 4vw, 34px); line-height: 1.2; text-wrap: balance; }
.top h1 .hz { color: var(--accent); font-size: .8em; margin-left: 8px; }
.top p { margin: 6px 0 0; color: var(--muted); max-width: 64ch; }
.progress { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 14px; color: var(--muted); }
.bar { flex: 0 1 260px; height: 8px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 32px; padding-block: 24px 64px; align-items: start; }
nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 18px; }
.toc h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.toc ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.toc button { width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 6px 10px; display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: baseline; font-size: 14.5px; }
.toc button:hover { background: var(--sunken); }
.toc button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toc .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); align-self: center; }
.toc .done .dot { background: var(--good); border-color: var(--good); }
.toc .tz { font-family: var(--f-hz); color: var(--muted); font-size: 13px; margin-left: 4px; font-weight: 500; }

main { min-width: 0; }
.eyebrow { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.case h2 { margin: 4px 0 18px; font-size: clamp(22px, 3vw, 28px); line-height: 1.25; text-wrap: balance; }
.case h2 .hz { color: var(--accent); }
.case section { margin-top: 26px; }
.case h4 { margin: 0 0 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.case p { margin: 0 0 10px; max-width: 68ch; }

.scene { background: var(--sunken); border-radius: var(--r); padding: 16px 18px; }
.scene p:last-child { margin-bottom: 0; }
.pair { display: grid; gap: 10px; margin-top: 14px; }
.say { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; border-radius: var(--r); padding: 12px 14px; }
.say.bad { background: var(--bad-soft); }
.say.ok { background: var(--good-soft); }
.tag { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.bad .tag { color: var(--bad); }
.ok .tag { color: var(--good); }
.say .zh { font-family: var(--f-hz); font-size: 22px; line-height: 1.45; }
.bad .zh { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--bad) 55%, transparent); text-decoration-thickness: 2px; }
.say .vi { font-size: 14px; color: var(--muted); }
mark { background: var(--mark-soft); color: inherit; border-bottom: 2px solid var(--mark); padding: 0 1px; border-radius: 2px; }

.speak { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.speak:hover { color: var(--accent); border-color: var(--accent); }

.formula { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 15px; }
.formula span { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; }
.formula span.k { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-family: var(--f-hz); font-weight: 700; }
.formula em { font-style: normal; color: var(--muted); }
.formula + .formula { margin-top: 8px; }

.why ul { margin: 0; padding-left: 20px; max-width: 68ch; display: grid; gap: 6px; }
.why b.hz, .why .hz { font-weight: 700; }

.cmp { overflow-x: auto; }
.cmp table { border-collapse: collapse; width: 100%; min-width: 420px; }
.cmp td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.cmp td:first-child { width: 62px; }
.cmp .zh { font-family: var(--f-hz); font-size: 18px; }
.cmp .note { color: var(--muted); font-size: 14px; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 1px 9px; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }

.tip { border: 1.5px dashed var(--mark); border-radius: var(--r); padding: 12px 16px; background: var(--surface); }
.tip b { color: var(--mark); }

.quiz { display: grid; gap: 16px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.q .stem { font-family: var(--f-hz); font-size: 19px; margin-bottom: 10px; }
.q .stem small { font-family: var(--f-body); font-size: 14px; color: var(--muted); display: block; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opts.col { flex-direction: column; }
.opt { border: 1.5px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 14px; text-align: left; font-family: var(--f-hz); font-size: 17px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .l { font-family: var(--f-body); font-weight: 700; color: var(--muted); margin-right: 8px; font-size: 14px; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.explain { margin-top: 10px; font-size: 14.5px; color: var(--muted); }
.explain b { color: var(--fg); }
.explain a { color: var(--accent); }

.src { margin-top: 28px; font-size: 13.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-top: 22px; }
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 18px; font-weight: 600; font-size: 14.5px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { color: var(--on-accent); opacity: .92; }
.btn[aria-pressed="true"] { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.score { font-size: 15px; font-weight: 600; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  nav.toc { position: static; flex-direction: row; overflow-x: auto; gap: 14px; padding-bottom: 6px; }
  .toc .grp { flex: 0 0 auto; }
  .toc ul { flex-direction: row; gap: 6px; }
  .toc button { white-space: nowrap; border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; }
  .toc .tz { display: none; }
}
@media (max-width: 520px) {
  .say { grid-template-columns: minmax(0, 1fr) auto; }
  .say .tag { grid-column: 1 / -1; }
  .say .zh { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- Liquis glass ----------
   Chỉ có trên web Ngọc: build_site.py chèn /glass/glass.js vào <head> (html.glass-ok); tắt bằng nút
   (html[data-glass="off"], nhớ chung cả site). Bản artifact không có file này nên vẫn phẳng. Giống web/template.html. */
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.top-row .back { margin-bottom: 0; }
.glass-toggle { display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px; font-size: 13.5px; }
.glass-toggle__dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .35; flex: none; }
.glass-toggle[aria-pressed="true"] .glass-toggle__dot { opacity: 1; background: var(--mark); }
@supports (background: color-mix(in srgb, red 50%, transparent)) {
:root.glass-ok:not([data-glass="off"]) {
  --gl-bg: color-mix(in srgb, var(--surface) 58%, transparent);
  --gl-bg-strong: color-mix(in srgb, var(--surface) 84%, transparent);
  --gl-sunken: color-mix(in srgb, var(--sunken) 70%, transparent);
  --gl-filter: blur(var(--lg-blur, 22px)) saturate(var(--lg-saturate, 180%));
  --gl-hi: rgb(255 255 255 / .75);
  --gl-shadow: inset 0 1px 0 var(--gl-hi), 0 10px 30px -14px rgb(40 15 50 / .28);
  --gl-shadow-sm: inset 0 1px 0 var(--gl-hi), 0 2px 8px -3px rgb(40 15 50 / .14);
  --gl-blob: 34%;
}
@media (prefers-color-scheme: dark) {
  :root.glass-ok:not([data-glass="off"]):not([data-theme="light"]) { --gl-bg: color-mix(in srgb, var(--surface) 64%, transparent); --gl-hi: rgb(255 255 255 / .08); --gl-blob: 20%;
    --gl-shadow: inset 0 1px 0 var(--gl-hi), 0 12px 32px -12px rgb(0 0 0 / .55); --gl-shadow-sm: inset 0 1px 0 var(--gl-hi), 0 2px 8px -3px rgb(0 0 0 / .4); }
}
:root.glass-ok[data-theme="dark"]:not([data-glass="off"]) { --gl-bg: color-mix(in srgb, var(--surface) 64%, transparent); --gl-hi: rgb(255 255 255 / .08); --gl-blob: 20%;
  --gl-shadow: inset 0 1px 0 var(--gl-hi), 0 12px 32px -12px rgb(0 0 0 / .55); --gl-shadow-sm: inset 0 1px 0 var(--gl-hi), 0 2px 8px -3px rgb(0 0 0 / .4); }
@media (prefers-reduced-transparency: reduce) { :root.glass-ok:not([data-glass="off"]) { --gl-bg: color-mix(in srgb, var(--surface) 94%, transparent); } }

/* nền có vài đốm màu theo giao diện để kính có cái mà nhòe */
:root.glass-ok:not([data-glass="off"]) body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background:
    radial-gradient(55vmax 45vmax at 6% -4%, color-mix(in srgb, var(--accent) var(--gl-blob), transparent), transparent 70%),
    radial-gradient(45vmax 40vmax at 102% 18%, color-mix(in srgb, var(--mark) var(--gl-blob), transparent), transparent 70%),
    radial-gradient(50vmax 40vmax at 30% 104%, color-mix(in srgb, var(--mark) calc(var(--gl-blob) * .7), transparent), transparent 70%),
    radial-gradient(45vmax 40vmax at 96% 96%, color-mix(in srgb, var(--accent) calc(var(--gl-blob) * .8), transparent), transparent 70%); }

/* mặt kính: tình huống, câu hỏi, mẹo, bảng so sánh; câu sai/đúng giữ màu đỏ/xanh nhưng trong hơn */
:root.glass-ok:not([data-glass="off"]) :is(.scene, .q, .tip, .cmp) {
  background: var(--gl-bg); -webkit-backdrop-filter: var(--gl-filter); backdrop-filter: var(--gl-filter); box-shadow: var(--gl-shadow); }
:root.glass-ok:not([data-glass="off"]) .cmp { border-radius: var(--r); padding: 4px 12px; }
:root.glass-ok:not([data-glass="off"]) .say.bad { background: color-mix(in srgb, var(--bad-soft) 78%, transparent); -webkit-backdrop-filter: var(--gl-filter); backdrop-filter: var(--gl-filter); box-shadow: var(--gl-shadow-sm); }
:root.glass-ok:not([data-glass="off"]) .say.ok { background: color-mix(in srgb, var(--good-soft) 78%, transparent); -webkit-backdrop-filter: var(--gl-filter); backdrop-filter: var(--gl-filter); box-shadow: var(--gl-shadow-sm); }
:root.glass-ok:not([data-glass="off"]) .bar { background: var(--gl-sunken); }
:root.glass-ok:not([data-glass="off"]) .toc button[aria-current="true"] { background: color-mix(in srgb, var(--accent-soft) 80%, transparent); }
:root.glass-ok:not([data-glass="off"]) .toc button:not([aria-current="true"]):hover { background: var(--gl-sunken); }

/* nút: kính mỏng; nút chính (màu đặc) và đáp án đúng/sai giữ nguyên */
:root.glass-ok:not([data-glass="off"]) :is(.btn:not(.primary):not([aria-pressed="true"]), .speak, .glass-toggle, .opt:not(.right):not(.wrong), .formula span:not(.k)) {
  background: var(--gl-bg); -webkit-backdrop-filter: var(--gl-filter); backdrop-filter: var(--gl-filter); box-shadow: var(--gl-shadow-sm); }
:root.glass-ok:not([data-glass="off"]) :is(.btn:not(.primary):hover, .opt:not(.right):not(.wrong):not(:disabled):hover) { background: var(--gl-bg-strong); }
@media (max-width: 860px) {
  :root.glass-ok:not([data-glass="off"]) .toc button:not([aria-current="true"]) { background: var(--gl-bg); -webkit-backdrop-filter: var(--gl-filter); backdrop-filter: var(--gl-filter); }
}
}
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row" id="topRow" hidden>
      <a class="back" href="../">← Ngọc học tiếng Trung</a>
      <button class="btn glass-toggle" id="glassBtn" type="button" data-glass-toggle aria-pressed="true" hidden><span class="glass-toggle__dot" aria-hidden="true"></span><span data-glass-label>Liquis glass: on</span></button>
    </div>
    <h1>Ngữ pháp qua tình huống <span class="hz">情景语法</span></h1>
    <p>Mỗi bài bắt đầu bằng một câu Ngọc rất dễ nói sai, rồi giải thích vì sao sai, cách sửa và cho làm thử ngay. Đây cũng chính là các lỗi mà phần Đọc 1 của HSK 6 (chọn câu sai) hay kiểm tra.</p>
    <div class="progress"><div class="bar"><i id="bar"></i></div><span id="progText">0 bài đã hiểu</span></div>
  </div>
</header>

<div class="wrap layout">
  <nav class="toc" id="toc" aria-label="Danh sách tình huống"></nav>
  <main id="main" aria-live="polite"><p>Đang tải bài…</p></main>
</div>

<script>
// [..] trong câu = phần cần chú ý, được tô màu.
// Nội dung (nhóm bài, tình huống) nằm trong cơ sở dữ liệu, đọc qua /api/node/grammar.
// Chưa có dữ liệu hoặc lỗi mạng thì dùng bản đi kèm trang (data.json, chép từ web/ngu-phap.json lúc dựng site).
let GROUPS = [], CASES = [];
async function loadData() {
  for (const url of ["/api/node/grammar", "data.json"]) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) continue;
      const d = await r.json();
      if (Array.isArray(d.groups) && Array.isArray(d.cases) && d.cases.length) return d;
    } catch (e) {}
  }
  return null;
}

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let done = store.get("ngoc-np-done", {});

// Trên web Ngọc (site/ngu-phap/): hiện nút về trang chủ và dùng giao diện Ngọc đã chọn ở đó
if (/\/ngu-phap\/(index\.html)?$/.test(location.pathname)) {
  document.getElementById("topRow").hidden = false;
  if (window.glassMode) document.getElementById("glassBtn").hidden = false;
  const skin = store.get("ngoc-hoc-tieng-trung", {}).skin;
  if (skin) document.documentElement.setAttribute("data-skin", skin);
}
let current = 0;

const hl = s => s.replace(/\[([^\]]+)\]/g, "<mark>$1</mark>");
const plain = s => s.replace(/[\[\]]/g, "");
const L = "ABCD";

// Đọc mẫu bằng giọng tiếng Trung của máy, nếu trình duyệt có.
let zhVoice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  zhVoice = vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(plain(text));
  u.lang = "zh-CN"; u.rate = .85;
  if (zhVoice) u.voice = zhVoice;
  speechSynthesis.speak(u);
}
const canSpeak = "speechSynthesis" in window;
const speakBtn = t => canSpeak ? `<button class="speak" data-say="${plain(t)}" aria-label="Nghe câu này">Nghe</button>` : "";

function renderToc() {
  const toc = document.getElementById("toc");
  toc.innerHTML = GROUPS.map(g => `
    <div class="grp"><h3>${g.name}</h3><ul>
      ${CASES.map((c, i) => c.g !== g.id ? "" : `
        <li class="${done[c.id] ? "done" : ""}"><button data-i="${i}" aria-current="${i === current}">
          <span class="dot"></span><span>${c.short}<span class="tz">${c.zh}</span></span>
        </button></li>`).join("")}
    </ul></div>`).join("");
  const learnable = CASES.filter(c => !c.test);
  const n = learnable.filter(c => done[c.id]).length;
  document.getElementById("bar").style.width = (n / learnable.length * 100) + "%";
  document.getElementById("progText").textContent = `${n}/${learnable.length} bài đã hiểu`;
}

function quizHtml(c) {
  return c.quiz.map((q, qi) => `
    <div class="q" data-q="${qi}">
      <div class="stem">${c.test ? `<small>Câu ${qi + 1}. Câu nào sai?</small>` : `${q.stem === "Chọn câu đúng" || q.stem === "Chọn cách nói tự nhiên" ? `<small>${q.stem}</small>` : q.stem}`}</div>
      <div class="opts ${q.col || c.test ? "col" : ""}">
        ${q.opts.map((o, oi) => `<button class="opt" data-o="${oi}"><span class="l">${L[oi]}</span>${o}</button>`).join("")}
      </div>
      <div class="explain" hidden></div>
    </div>`).join("");
}

function renderCase() {
  const c = CASES[current];
  const grp = GROUPS.find(g => g.id === c.g).name;
  const main = document.getElementById("main");
  let body;
  if (c.test) {
    body = `
      <p>${c.intro}</p>
      <section><div class="quiz">${quizHtml(c)}</div>
      <p class="score" id="score" style="margin-top:14px"></p></section>`;
  } else {
    body = `
      <section><h4>Tình huống</h4>
        <div class="scene"><p>${c.scene}</p></div>
        <div class="pair">
          <div class="say bad"><span class="tag">Câu sai</span><div class="zh">${hl(c.wrong)}</div><span></span></div>
          <div class="say ok"><span class="tag">Câu đúng</span><div><div class="zh">${hl(c.right)}</div><div class="vi">${c.vi}</div></div>${speakBtn(c.right)}</div>
        </div>
      </section>
      <section class="why"><h4>Vì sao?</h4><ul>${c.why.map(w => `<li>${w}</li>`).join("")}</ul></section>
      <section><h4>Công thức</h4>
        ${c.formula.map(f => `<div class="formula">${f.map(p => /^[一-鿿/…()（）]+$/.test(p) && !/^\(/.test(p) ? `<span class="k">${p}</span>` : `<span>${p}</span>`).join("<em>+</em>")}</div>`).join("")}
      </section>
      <section><h4>So sánh nhanh</h4><div class="cmp"><table>
        ${c.cmp.map(([k, s, n]) => `<tr><td><span class="pill ${k}">${k === "ok" ? "Đúng" : "Sai"}</span></td><td><div class="zh">${s}</div>${n ? `<div class="note">${n}</div>` : ""}</td></tr>`).join("")}
      </table></div></section>
      <section><div class="tip">${c.tip}</div></section>
      <section><h4>Thử ngay</h4><div class="quiz">${quizHtml(c)}</div></section>`;
  }
  main.innerHTML = `
    <article class="case">
      <div class="eyebrow">${grp} · <span class="hz">${c.zh}</span></div>
      <h2>${c.title}</h2>
      ${body}
      <div class="src">Nguồn: ${c.src}</div>
      <div class="foot">
        <button class="btn" id="prev" ${current === 0 ? "hidden" : ""}>← Bài trước</button>
        ${c.test ? "" : `<button class="btn" id="mark" aria-pressed="${!!done[c.id]}">${done[c.id] ? "Đã hiểu bài này" : "Đánh dấu đã hiểu"}</button>`}
        <button class="btn primary" id="next" ${current === CASES.length - 1 ? "hidden" : ""}>Bài sau →</button>
      </div>
    </article>`;
}

function go(i, scroll) {
  current = Math.max(0, Math.min(CASES.length - 1, i));
  testScore = {};
  renderCase(); renderToc();
  try { history.replaceState(null, "", "#" + CASES[current].id); } catch (e) {}
  if (scroll) document.querySelector(".layout").scrollIntoView({ behavior: "smooth", block: "start" });
}

let testScore = {};
document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.i !== undefined) return go(+t.dataset.i, true);
  if (t.dataset.say) return speak(t.dataset.say);
  if (t.id === "prev") return go(current - 1, true);
  if (t.id === "next") return go(current + 1, true);
  if (t.id === "mark") {
    const id = CASES[current].id;
    done[id] = !done[id]; store.set("ngoc-np-done", done);
    renderCase(); renderToc(); return;
  }
  if (t.classList.contains("opt")) {
    const c = CASES[current];
    const qEl = t.closest(".q"), q = c.quiz[+qEl.dataset.q], pick = +t.dataset.o;
    qEl.querySelectorAll(".opt").forEach((b, oi) => {
      b.disabled = true;
      if (oi === q.a) b.classList.add("right");
      else if (oi === pick) b.classList.add("wrong");
    });
    const ok = pick === q.a;
    const ref = q.ref ? CASES.findIndex(x => x.id === q.ref) : -1;
    const ex = qEl.querySelector(".explain");
    ex.innerHTML = `<b>${ok ? "Chính xác." : `Chưa đúng, đáp án là ${L[q.a]}.`}</b> ${q.ex}` +
      (ref >= 0 ? ` <a href="#${q.ref}" data-go="${ref}">Ôn lại: ${CASES[ref].short}</a>` : "");
    ex.hidden = false;
    if (c.test) {
      testScore[qEl.dataset.q] = ok;
      const answered = Object.keys(testScore).length, right = Object.values(testScore).filter(Boolean).length;
      document.getElementById("score").textContent = `Đúng ${right}/${answered} câu đã làm` + (answered === c.quiz.length ? ` · tổng ${c.quiz.length} câu` : "");
    }
  }
});
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-go]");
  if (a) { e.preventDefault(); go(+a.dataset.go, true); }
});

loadData().then(d => {
  if (!d) {
    document.getElementById("main").innerHTML = "<p>Chưa tải được bài ngữ pháp. Kiểm tra mạng rồi tải lại trang.</p>";
    return;
  }
  GROUPS = d.groups; CASES = d.cases;
  const start = CASES.findIndex(c => c.id === (location.hash || "").slice(1));
  go(start >= 0 ? start : 0, false);
});
</script>

</html>
